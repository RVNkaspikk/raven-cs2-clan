<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RÆVEN — CS2 Clan</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

/* BACKGROUND */
.background {
    position: fixed;
    inset: 0;
    z-index: -10;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 15%, rgba(255,0,0,.15), transparent 35%),
        #050505;
}

.dot {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    opacity: .5;
    animation: moveDot linear infinite;
}

@keyframes moveDot {
    from {
        transform: translateY(110vh);
    }
    to {
        transform: translateY(-10vh);
    }
}

/* NAV */
nav {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 40px);
    max-width: 1100px;
    padding: 15px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(15,15,15,.75);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px;
    z-index: 1000;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 4px;
}

.logo span {
    color: #ff1515;
}

nav a {
    color: #aaa;
    text-decoration: none;
    margin-left: 22px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
    transition: .2s;
}

nav a:hover {
    color: #ff2020;
}

/* HERO */
.hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 100px 20px 40px;
}

.hero h1 {
    font-size: clamp(75px, 15vw, 190px);
    line-height: .8;
    font-weight: 1000;
    letter-spacing: -8px;
    text-shadow:
        0 0 25px rgba(255,0,0,.25),
        0 0 80px rgba(255,0,0,.1);
}

.hero h1 span {
    color: #ff1717;
}

.hero p {
    margin-top: 30px;
    color: #888;
    letter-spacing: 5px;
    font-size: 14px;
}

.btn {
    display: inline-block;
    margin-top: 35px;
    padding: 15px 32px;
    border: none;
    border-radius: 10px;
    background: #ff1717;
    color: white;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
    text-decoration: none;
    transition: .25s;
    box-shadow: 0 0 30px rgba(255,0,0,.25);
}

.btn:hover {
    transform: translateY(-3px);
    background: #ff3030;
    box-shadow: 0 0 45px rgba(255,0,0,.4);
}

/* SECTIONS */
section {
    max-width: 1150px;
    margin: auto;
    padding: 110px 25px;
}

.section-title {
    text-align: center;
    margin-bottom: 55px;
}

.section-title h2 {
    font-size: 45px;
    font-weight: 1000;
    letter-spacing: 3px;
}

.section-title h2 span {
    color: #ff1717;
}

.section-title p {
    color: #777;
    margin-top: 10px;
}

/* MEMBERS */
.members {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.member-card {
    padding: 35px 20px;
    text-align: center;
    background: rgba(20,20,20,.7);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 18px;
    backdrop-filter: blur(15px);
    cursor: pointer;
    transition: .3s;
}

.member-card:hover {
    transform: translateY(-7px);
    border-color: rgba(255,0,0,.4);
    box-shadow: 0 15px 50px rgba(255,0,0,.12);
}

.member-emoji {
    font-size: 36px;
    margin-bottom: 12px;
}

.member-name {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 2px;
}

.member-role {
    color: #ff2020;
    margin-top: 8px;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
}

/* JOIN */
.join-box {
    max-width: 650px;
    margin: auto;
    padding: 35px;
    background: rgba(15,15,15,.75);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 20px;
    backdrop-filter: blur(15px);
}

.input {
    margin-bottom: 15px;
}

.input input,
.input textarea {
    width: 100%;
    padding: 15px;
    background: #0b0b0b;
    color: white;
    border: 1px solid #222;
    border-radius: 9px;
    outline: none;
    font-family: inherit;
}

.input textarea {
    min-height: 130px;
    resize: vertical;
}

.input input:focus,
.input textarea:focus {
    border-color: #ff1717;
}

.join-box .btn {
    width: 100%;
}

/* STAFF */
.staff-login {
    max-width: 400px;
    margin: auto;
    text-align: center;
}

.staff-login input {
    width: 100%;
    padding: 15px;
    background: #0b0b0b;
    color: white;
    border: 1px solid #222;
    border-radius: 9px;
    outline: none;
}

.staff-panel {
    display: none;
}

.panel-box {
    padding: 25px;
    margin-bottom: 25px;
    background: rgba(15,15,15,.75);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px;
}

.panel-box h3 {
    color: #ff1717;
    margin-bottom: 20px;
}

.application {
    padding: 20px;
    margin-bottom: 15px;
    background: #0b0b0b;
    border: 1px solid #222;
    border-radius: 12px;
}

.application strong {
    color: #ff2222;
}

.application p {
    color: #aaa;
    margin: 7px 0;
    word-break: break-word;
}

.application a {
    color: #ff4444;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.accept,
.reject,
.kick {
    border: none;
    padding: 10px 15px;
    border-radius: 7px;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.accept {
    background: #15803d;
}

.reject,
.kick {
    background: #b91c1c;
}

.staff-member {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 15px;
    margin-bottom: 10px;
    background: #0b0b0b;
    border: 1px solid #222;
    border-radius: 10px;
}

.staff-member-role {
    color: #ff2222;
    font-size: 11px;
    margin-left: 6px;
}

footer {
    padding: 80px 20px;
    text-align: center;
    color: #555;
    letter-spacing: 5px;
    font-weight: 900;
    border-top: 1px solid #151515;
}

footer span {
    color: #ff1717;
}

@media(max-width:650px) {
    nav {
        width: calc(100% - 20px);
        padding: 12px 15px;
    }

    nav a {
        margin-left: 8px;
        font-size: 9px;
    }

    .logo {
        font-size: 18px;
    }

    .hero h1 {
        letter-spacing: -4px;
    }

    .join-box {
        padding: 20px;
    }

    .actions {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="background" id="background"></div>

<nav>
    <div class="logo">R<span>Æ</span>VEN</div>

    <div>
        <a href="#home">HOME</a>
        <a href="#members">MEMBERS</a>
        <a href="#join">JOIN</a>
        <a href="#staff">STAFF</a>
    </div>
</nav>

<!-- HOME -->
<div class="hero" id="home">
    <div>
        <h1>R<span>Æ</span>VEN</h1>
        <p>CS2 CLAN • NO MERCY</p>
        <a href="#join" class="btn">JOIN RÆVEN</a>
    </div>
</div>

<!-- MEMBERS -->
<section id="members">

    <div class="section-title">
        <h2>OUR <span>MEMBERS</span></h2>
        <p>Meet the RÆVEN squad.</p>
    </div>

    <div class="members" id="membersList">
        <p style="text-align:center;color:#777;">
            Loading members...
        </p>
    </div>

</section>

<!-- JOIN -->
<section id="join">

    <div class="section-title">
        <h2>JOIN <span>RÆVEN</span></h2>
        <p>Think you have what it takes?</p>
    </div>

    <div class="join-box">

        <form id="joinForm">

            <div class="input">
                <input
                    id="nick"
                    type="text"
                    placeholder="CS2 Nickname"
                    required
                >
            </div>

            <div class="input">
                <input
                    id="discord"
                    type="text"
                    placeholder="Discord"
                    required
                >
            </div>

            <div class="input">
                <input
                    id="clip"
                    type="url"
                    placeholder="Clip URL"
                    required
                >
            </div>

            <div class="input">
                <textarea
                    id="about"
                    placeholder="Tell us about yourself..."
                    required
                ></textarea>
            </div>

            <button class="btn" type="submit">
                SEND APPLICATION
            </button>

        </form>

        <p
            id="joinStatus"
            style="text-align:center;margin-top:15px;color:#777;"
        ></p>

    </div>

</section>

<!-- STAFF -->
<section id="staff">

    <div class="section-title">
        <h2><span>STAFF</span> PANEL</h2>
        <p>RÆVEN administration.</p>
    </div>

    <div class="staff-login" id="staffLogin">

        <input
            id="staffPassword"
            type="password"
            placeholder="Staff password"
        >

        <button
            class="btn"
            onclick="loginStaff()"
        >
            LOGIN
        </button>

        <p
            id="loginStatus"
            style="margin-top:12px;color:#777;"
        ></p>

    </div>

    <div class="staff-panel" id="staffPanel">

        <div class="panel-box">

            <h3>APPLICATIONS</h3>

            <div id="applicationsList">
                Loading...
            </div>

        </div>

        <div class="panel-box">

            <h3>MEMBERS</h3>

            <div id="staffMembersList">
                Loading...
            </div>

        </div>

    </div>

</section>

<footer>
    <span>RÆVEN</span> ON TOP
</footer>

<script>

/* =====================================================
   SUPABASE CONNECTION
   ===================================================== */

const SUPABASE_URL =
    "https://mrctqcrcbmbsamfevmii.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_jdrEHYNZqzor4qleQxQ3Aw_M-SyWoWA";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   BACKGROUND
   ===================================================== */

const background =
    document.getElementById("background");

for (let i = 0; i < 80; i++) {

    const dot =
        document.createElement("div");

    dot.className = "dot";

    dot.style.left =
        Math.random() * 100 + "%";

    dot.style.animationDuration =
        (5 + Math.random() * 12) + "s";

    dot.style.animationDelay =
        Math.random() * 10 + "s";

    background.appendChild(dot);
}


/* =====================================================
   EMOJI
   ===================================================== */

function getEmoji(member) {

    const name =
        member.name.toUpperCase();

    if (name === "MONARCH")
        return "👑";

    if (
        name === "RENOX" ||
        name === "KASPIKK"
    )
        return "🗿";

    return "💀";
}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =====================================================
   LOAD MEMBERS
   ===================================================== */

async function loadMembers() {

    const list =
        document.getElementById("membersList");

    list.innerHTML =
        `<p style="text-align:center;color:#777;">
            Loading members...
        </p>`;

    const result =
        await supabaseClient
            .from("members")
            .select("*")
            .order("id", {
                ascending: true
            });

    console.log("MEMBERS RESULT:", result);

    if (result.error) {

        console.error(
            "SUPABASE MEMBERS ERROR:",
            result.error
        );

        list.innerHTML = `
            <div style="
                grid-column:1/-1;
                text-align:center;
                color:#ff3333;
                padding:30px;
            ">
                <b>Could not load members.</b>
                <br><br>
                ${escapeHTML(result.error.message)}
            </div>
        `;

        return;
    }

    const members =
        result.data || [];

    if (members.length === 0) {

        list.innerHTML = `
            <div style="
                grid-column:1/-1;
                text-align:center;
                color:#777;
            ">
                No members yet.
            </div>
        `;

        return;
    }

    list.innerHTML = "";

    members.forEach(member => {

        const card =
            document.createElement("div");

        card.className =
            "member-card";

        card.innerHTML = `
            <div class="member-emoji">
                ${escapeHTML(
                    member.emoji || getEmoji(member)
                )}
            </div>

            <div class="member-name">
                ${escapeHTML(member.name)}
            </div>

            <div class="member-role">
                ${escapeHTML(member.role)}
            </div>
        `;

        if (member.instagram) {

            card.style.cursor = "pointer";

            card.onclick = () => {

                window.open(
                    member.instagram,
                    "_blank",
                    "noopener,noreferrer"
                );

            };
        }

        list.appendChild(card);

    });

}


/* =====================================================
   JOIN APPLICATION
   ===================================================== */

document
    .getElementById("joinForm")
    .addEventListener(
        "submit",
        async function(e) {

            e.preventDefault();

            const status =
                document.getElementById(
                    "joinStatus"
                );

            const nick =
                document.getElementById("nick")
                    .value.trim();

            const discord =
                document.getElementById("discord")
                    .value.trim();

            const clip =
                document.getElementById("clip")
                    .value.trim();

            const about =
                document.getElementById("about")
                    .value.trim();

            status.style.color = "#aaa";
            status.textContent =
                "Sending application...";

            const result =
                await supabaseClient
                    .from("applications")
                    .insert({
                        nick: nick,
                        discord: discord,
                        clip: clip,
                        about: about
                    });

            console.log(
                "APPLICATION RESULT:",
                result
            );

            if (result.error) {

                status.style.color =
                    "#ff3333";

                status.textContent =
                    result.error.message;

                return;
            }

            status.style.color =
                "#36ff75";

            status.textContent =
                "Application sent successfully!";

            document
                .getElementById("joinForm")
                .reset();

            loadApplications();

        }
    );


/* =====================================================
   STAFF
   ===================================================== */

const STAFF_PASSWORD =
    "raven123";

function loginStaff() {

    const password =
        document
            .getElementById("staffPassword")
            .value;

    const status =
        document
            .getElementById("loginStatus");

    if (password === STAFF_PASSWORD) {

        document
            .getElementById("staffLogin")
            .style.display = "none";

        document
            .getElementById("staffPanel")
            .style.display = "block";

        loadApplications();
        loadStaffMembers();

    } else {

        status.style.color =
            "#ff3333";

        status.textContent =
            "Wrong password.";
    }
}


/* =====================================================
   APPLICATIONS
   ===================================================== */

async function loadApplications() {

    const list =
        document.getElementById(
            "applicationsList"
        );

    if (!list) return;

    const result =
        await supabaseClient
            .from("applications")
            .select("*")
            .order("created_at", {
                ascending: false
            });

    console.log(
        "APPLICATIONS RESULT:",
        result
    );

    if (result.error) {

        list.innerHTML =
            `<p style="color:#ff3333;">
                ${escapeHTML(
                    result.error.message
                )}
            </p>`;

        return;
    }

    const applications =
        result.data || [];

    if (applications.length === 0) {

        list.innerHTML =
            `<p style="color:#777;">
                No applications.
            </p>`;

        return;
    }

    list.innerHTML = "";

    applications.forEach(app => {

        const box =
            document.createElement("div");

        box.className =
            "application";

        box.innerHTML = `

            <strong>
                ${escapeHTML(app.nick)}
            </strong>

            <p>
                Discord:
                ${escapeHTML(app.discord)}
            </p>

            <p>
                About:
                ${escapeHTML(app.about)}
            </p>

            <p>
                Clip:
                <a
                    href="${safeURL(app.clip)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Open Clip
                </a>
            </p>

            <div class="actions">

                <button
                    class="accept"
                    onclick="acceptApplication(${app.id})"
                >
                    ACCEPT
                </button>

                <button
                    class="reject"
                    onclick="rejectApplication(${app.id})"
                >
                    REJECT
                </button>

            </div>
        `;

        list.appendChild(box);

    });
}


/* =====================================================
   ACCEPT
   ===================================================== */

async function acceptApplication(id) {

    const result =
        await supabaseClient
            .from("applications")
            .select("*")
            .eq("id", id)
            .single();

    if (result.error ||
        !result.data) {

        alert(
            "Application not found."
        );

        return;
    }

    const app =
        result.data;

    if (
        !confirm(
            `Accept ${app.nick} into RÆVEN?`
        )
    ) return;

    const insertResult =
        await supabaseClient
            .from("members")
            .insert({
                name: app.nick,
                role: "MEMBER",
                emoji: "💀",
                protected: false,
                instagram: ""
            });

    if (insertResult.error) {

        console.error(
            insertResult.error
        );

        alert(
            insertResult.error.message
        );

        return;
    }

    const deleteResult =
        await supabaseClient
            .from("applications")
            .delete()
            .eq("id", id);

    if (deleteResult.error) {

        alert(
            "Member added, but application was not deleted."
        );

        return;
    }

    alert(
        `${app.nick} joined RÆVEN!`
    );

    loadMembers();
    loadApplications();
    loadStaffMembers();
}


/* =====================================================
   REJECT
   ===================================================== */

async function rejectApplication(id) {

    if (
        !confirm(
            "Reject this application?"
        )
    ) return;

    const result =
        await supabaseClient
            .from("applications")
            .delete()
            .eq("id", id);

    if (result.error) {

        alert(
            result.error.message
        );

        return;
    }

    loadApplications();
}


/* =====================================================
   STAFF MEMBERS
   ===================================================== */

async function loadStaffMembers() {

    const list =
        document.getElementById(
            "staffMembersList"
        );

    if (!list) return;

    const result =
        await supabaseClient
            .from("members")
            .select("*")
            .order("id", {
                ascending: true
            });

    if (result.error) {

        list.innerHTML =
            `<p style="color:#ff3333;">
                ${escapeHTML(
                    result.error.message
                )}
            </p>`;

        return;
    }

    const members =
        result.data || [];

    list.innerHTML = "";

    members.forEach(member => {

        const row =
            document.createElement("div");

        row.className =
            "staff-member";

        row.innerHTML = `
            <div>
                ${escapeHTML(
                    member.emoji || getEmoji(member)
                )}

                <b>
                    ${escapeHTML(member.name)}
                </b>

                <span class="staff-member-role">
                    ${escapeHTML(member.role)}
                </span>
            </div>
        `;

        if (member.protected) {

            const protectedText =
                document.createElement("span");

            protectedText.style.color =
                "#777";

            protectedText.textContent =
                "PROTECTED";

            row.appendChild(
                protectedText
            );

        } else {

            const kick =
                document.createElement("button");

            kick.className =
                "kick";

            kick.textContent =
                "KICK";

            kick.onclick = () =>
                kickMember(
                    member.id,
                    member.name
                );

            row.appendChild(kick);
        }

        list.appendChild(row);

    });
}


/* =====================================================
   KICK
   ===================================================== */

async function kickMember(id, name) {

    if (
        name.toUpperCase() ===
        "MONARCH"
    ) {

        alert(
            "MONARCH is protected."
        );

        return;
    }

    if (
        !confirm(
            `Kick ${name} from RÆVEN?`
        )
    ) return;

    const result =
        await supabaseClient
            .from("members")
            .delete()
            .eq("id", id);

    if (result.error) {

        alert(
            result.error.message
        );

        return;
    }

    loadMembers();
    loadStaffMembers();
}


/* =====================================================
   SAFE URL
   ===================================================== */

function safeURL(value) {

    try {

        const url =
            new URL(value);

        if (
            url.protocol === "http:" ||
            url.protocol === "https:"
        ) {
            return url.href;
        }

    } catch(e) {}

    return "#";
}


/* =====================================================
   REALTIME
   ===================================================== */

supabaseClient
    .channel("raven-members")
    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "members"
        },
        () => {
            loadMembers();
            loadStaffMembers();
        }
    )
    .subscribe();

supabaseClient
    .channel("raven-applications")
    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "applications"
        },
        () => {
            loadApplications();
        }
    )
    .subscribe();


/* =====================================================
   START
   ===================================================== */

loadMembers();

</script>

</body>
</html>
