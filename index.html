<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RÆVEN — CS2 CLAN</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#050505;
    color:white;
    overflow-x:hidden;
}

/* BACKGROUND */

#particles{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:-2;
    background:
    radial-gradient(
        circle at 50% 20%,
        #260000 0%,
        #090000 32%,
        #050505 75%
    );
}

.dot{
    position:absolute;
    background:white;
    border-radius:50%;
    opacity:.7;
    animation:float 8s linear infinite;
}

@keyframes float{

    0%{
        transform:translateY(105vh);
        opacity:0;
    }

    15%{
        opacity:.8;
    }

    85%{
        opacity:.8;
    }

    100%{
        transform:translateY(-10vh);
        opacity:0;
    }

}

/* NAV */

nav{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);

    width:92%;
    max-width:1100px;

    padding:15px 25px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(20,20,20,.75);

    border:1px solid rgba(255,255,255,.1);

    border-radius:18px;

    backdrop-filter:blur(15px);

    z-index:1000;

    box-shadow:
    0 0 30px rgba(255,0,0,.12);
}

.logo{
    font-size:25px;
    font-weight:1000;
    letter-spacing:4px;
    color:#ff2020;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    font-size:14px;
    font-weight:bold;
    transition:.25s;
}

nav a:hover{
    color:#ff2020;
}

/* HERO */

.hero{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:120px 20px 60px;
}

.hero-content{
    max-width:950px;
}

.tag{
    color:#ff2929;
    font-weight:bold;
    letter-spacing:5px;
    margin-bottom:20px;
}

.hero h1{
    font-size:clamp(75px,17vw,190px);
    line-height:.8;

    letter-spacing:14px;

    font-weight:1000;

    text-shadow:
    0 0 15px rgba(255,0,0,.8),
    0 0 50px rgba(255,0,0,.35);
}

.hero p{
    margin:30px 0;

    color:#aaa;

    letter-spacing:3px;
}

.btn{
    display:inline-block;

    padding:15px 32px;

    background:#e50909;

    color:white;

    text-decoration:none;

    border-radius:10px;

    font-weight:900;

    border:1px solid #ff3b3b;

    box-shadow:
    0 0 25px rgba(255,0,0,.35);

    transition:.25s;

    cursor:pointer;
}

.btn:hover{
    transform:
    translateY(-3px)
    scale(1.03);

    background:#ff2020;

    box-shadow:
    0 0 40px rgba(255,0,0,.6);
}

/* SECTIONS */

section{
    padding:100px 20px;
}

.container{
    max-width:1100px;
    margin:auto;
}

.section-title{
    text-align:center;

    font-size:45px;

    margin-bottom:55px;

    letter-spacing:4px;
}

.section-title span{
    color:#ff2020;
}

/* MEMBERS */

.members{
    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

    gap:25px;
}

.member{
    position:relative;

    padding:35px 20px;

    text-align:center;

    background:
    rgba(20,20,20,.72);

    border:
    1px solid rgba(255,255,255,.09);

    border-radius:20px;

    backdrop-filter:blur(12px);

    transition:.3s;

    cursor:pointer;

    overflow:hidden;
}

.member:hover{
    transform:translateY(-8px);

    border-color:#ff2020;

    box-shadow:
    0 15px 45px
    rgba(255,0,0,.18);
}

.member::before{
    content:"";

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:2px;

    background:#ff2020;

    box-shadow:
    0 0 20px #ff2020;
}

.member-emoji{
    font-size:42px;
    margin-bottom:10px;
}

.member-name{
    font-size:25px;

    font-weight:900;

    letter-spacing:2px;
}

.member-role{
    margin-top:8px;

    color:#ff2929;

    font-size:12px;

    font-weight:bold;

    letter-spacing:3px;
}

/* JOIN */

.join-box{
    max-width:650px;

    margin:auto;

    padding:35px;

    background:
    rgba(15,15,15,.82);

    border:
    1px solid rgba(255,255,255,.1);

    border-radius:22px;

    backdrop-filter:blur(15px);
}

input,
textarea{

    width:100%;

    margin-bottom:15px;

    padding:15px;

    border-radius:10px;

    border:
    1px solid #292929;

    background:#090909;

    color:white;

    outline:none;

    font-size:15px;
}

input:focus,
textarea:focus{

    border-color:#ff2020;

    box-shadow:
    0 0 15px
    rgba(255,0,0,.15);
}

textarea{
    min-height:130px;
    resize:vertical;
}

/* STAFF */

.staff-login{
    max-width:450px;
    margin:auto;
    text-align:center;
}

.staff-panel{
    display:none;

    max-width:1000px;

    margin:30px auto 0;
}

.panel-box{

    background:
    rgba(15,15,15,.88);

    border:
    1px solid rgba(255,255,255,.1);

    border-radius:20px;

    padding:25px;

    margin-bottom:25px;
}

.application,
.staff-member{

    background:#0b0b0b;

    border:
    1px solid #222;

    border-radius:14px;

    padding:18px;

    margin-bottom:15px;
}

.application h3,
.staff-member h3{
    margin-bottom:8px;
}

.application p{
    color:#aaa;

    margin:6px 0;

    word-break:break-word;
}

.application a{
    color:#ff3030;
}

.small-btn{

    border:0;

    padding:10px 15px;

    border-radius:8px;

    cursor:pointer;

    color:white;

    font-weight:bold;

    margin:
    10px 8px 0 0;
}

.accept{
    background:#0b8f38;
}

.reject{
    background:#b00000;
}

.kick{
    background:#9b0000;
}

.small-btn:hover{
    filter:brightness(1.25);
}

.status{
    text-align:center;

    margin-top:15px;

    color:#777;

    font-size:13px;
}

/* FOOTER */

footer{

    padding:50px 20px;

    text-align:center;

    color:#777;

    border-top:
    1px solid #171717;
}

footer strong{
    color:#ff2020;
}

/* MOBILE */

@media(max-width:700px){

    nav{
        padding:12px 15px;
    }

    nav a{
        margin-left:9px;
        font-size:10px;
    }

    .logo{
        font-size:18px;
    }

    .hero h1{
        letter-spacing:7px;
    }

    .section-title{
        font-size:35px;
    }

    .join-box{
        padding:20px;
    }

}

</style>
</head>

<body>

<div id="particles"></div>

<nav>

    <div class="logo">
        RÆVEN
    </div>

    <div>

        <a href="#home">
            HOME
        </a>

        <a href="#members">
            MEMBERS
        </a>

        <a href="#join">
            JOIN
        </a>

        <a href="#staff">
            STAFF
        </a>

    </div>

</nav>


<!-- HOME -->

<section
    class="hero"
    id="home"
>

    <div class="hero-content">

        <div class="tag">
            CS2 CLAN
        </div>

        <h1>
            RÆVEN
        </h1>

        <p>
            PLAY HARD. AIM HARDER.
        </p>

        <a
            href="#join"
            class="btn"
        >
            JOIN RÆVEN
        </a>

    </div>

</section>


<!-- MEMBERS -->

<section id="members">

    <div class="container">

        <h2 class="section-title">
            RÆVEN
            <span>MEMBERS</span>
        </h2>

        <div
            class="members"
            id="membersList"
        ></div>

        <div
            class="status"
            id="membersStatus"
        ></div>

    </div>

</section>


<!-- JOIN -->

<section id="join">

    <div class="container">

        <h2 class="section-title">
            JOIN
            <span>RÆVEN</span>
        </h2>

        <div class="join-box">

            <form id="joinForm">

                <input
                    id="nick"
                    type="text"
                    placeholder="CS2 Nickname"
                    maxlength="32"
                    required
                >

                <input
                    id="discord"
                    type="text"
                    placeholder="Discord"
                    maxlength="100"
                    required
                >

                <input
                    id="clip"
                    type="url"
                    placeholder="Clip URL"
                    required
                >

                <textarea
                    id="about"
                    placeholder="Tell us about yourself..."
                    maxlength="1000"
                    required
                ></textarea>

                <button
                    class="btn"
                    type="submit"
                    id="sendButton"
                >
                    SEND APPLICATION
                </button>

            </form>

            <div
                class="status"
                id="joinStatus"
            ></div>

        </div>

    </div>

</section>


<!-- STAFF -->

<section id="staff">

    <div class="container">

        <h2 class="section-title">
            RÆVEN
            <span>STAFF</span>
        </h2>


        <div
            class="staff-login"
            id="staffLogin"
        >

            <input
                id="staffPassword"
                type="password"
                placeholder="Staff Password"
            >

            <button
                class="btn"
                onclick="loginStaff()"
            >
                LOGIN
            </button>

            <div
                class="status"
                id="loginStatus"
            ></div>

        </div>


        <div
            class="staff-panel"
            id="staffPanel"
        >

            <div class="panel-box">

                <h2>
                    APPLICATIONS
                </h2>

                <br>

                <div
                    id="applicationsList"
                ></div>

            </div>


            <div class="panel-box">

                <h2>
                    CLAN MEMBERS
                </h2>

                <br>

                <div
                    id="clanMembersList"
                ></div>

            </div>

        </div>

    </div>

</section>


<footer>

    <strong>
        RÆVEN ON TOP
    </strong>

    <br>
    <br>

    CS2 CLAN

</footer>


<script>

/* ==================================================
   SUPABASE CONFIG
================================================== */

const SUPABASE_URL =
    "SEM_PROJECT_URL";

const SUPABASE_KEY =
    "SEM_PUBLISHABLE_KEY";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==================================================
   STAFF PASSWORD
================================================== */

const STAFF_PASSWORD =
    "raven123";


/* ==================================================
   BACKGROUND DOTS
================================================== */

const particles =
    document.getElementById(
        "particles"
    );


for(let i = 0; i < 90; i++){

    const dot =
        document.createElement("div");

    dot.className =
        "dot";

    dot.style.left =
        Math.random() * 100 + "%";

    dot.style.animationDelay =
        Math.random() * 8 + "s";

    dot.style.animationDuration =
        (5 + Math.random() * 8) + "s";

    const size =
        2 + Math.random() * 4;

    dot.style.width =
        size + "px";

    dot.style.height =
        size + "px";

    particles.appendChild(dot);

}


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(text){

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* ==================================================
   MEMBERS
================================================== */

async function loadMembers(){

    const list =
        document.getElementById(
            "membersList"
        );

    const status =
        document.getElementById(
            "membersStatus"
        );


    const {
        data,
        error
    } = await supabaseClient

        .from("members")

        .select("*")

        .order(
            "id",
            {
                ascending:true
            }
        );


    if(error){

        console.error(error);

        status.textContent =
            "DATABASE ERROR: " +
            error.message;

        return;

    }


    list.innerHTML = "";


    data.forEach(member => {

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "member";


        card.innerHTML = `

            <div class="member-emoji">

                ${escapeHTML(
                    member.emoji
                )}

            </div>

            <div class="member-name">

                ${escapeHTML(
                    member.name
                )}

            </div>

            <div class="member-role">

                ${escapeHTML(
                    member.role
                )}

            </div>

        `;


        if(member.instagram){

            card.onclick = () => {

                window.open(
                    member.instagram,
                    "_blank",
                    "noopener,noreferrer"
                );

            };

        }


        list.appendChild(card);

    });


    status.textContent =
        data.length +
        " RÆVEN members";

}


/* ==================================================
   JOIN APPLICATION
================================================== */

document
.getElementById("joinForm")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const nick =
            document
            .getElementById("nick")
            .value
            .trim();


        const discord =
            document
            .getElementById("discord")
            .value
            .trim();


        const clip =
            document
            .getElementById("clip")
            .value
            .trim();


        const about =
            document
            .getElementById("about")
            .value
            .trim();


        const status =
            document
            .getElementById("joinStatus");


        const button =
            document
            .getElementById("sendButton");


        button.disabled = true;

        button.textContent =
            "SENDING...";


        const {
            error
        } = await supabaseClient

            .from("applications")

            .insert({

                nick:nick,

                discord:discord,

                clip:clip,

                about:about

            });


        if(error){

            console.error(error);

            status.textContent =
                "ERROR: " +
                error.message;

            button.disabled = false;

            button.textContent =
                "SEND APPLICATION";

            return;

        }


        status.textContent =
            "APPLICATION SENT! 🔥";


        document
        .getElementById("joinForm")
        .reset();


        button.disabled = false;

        button.textContent =
            "SEND APPLICATION";

    }
);


/* ==================================================
   STAFF LOGIN
================================================== */

function loginStaff(){

    const password =
        document
        .getElementById(
            "staffPassword"
        )
        .value;


    if(password !== STAFF_PASSWORD){

        document
        .getElementById(
            "loginStatus"
        )
        .textContent =
            "WRONG PASSWORD 💀";

        return;

    }


    document
    .getElementById(
        "staffLogin"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "staffPanel"
    )
    .style.display =
        "block";


    loadApplications();

    loadStaffMembers();

}


/* ==================================================
   APPLICATIONS
================================================== */

async function loadApplications(){

    const box =
        document.getElementById(
            "applicationsList"
        );


    const {
        data,
        error
    } = await supabaseClient

        .from("applications")

        .select("*")

        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        box.innerHTML =
            `<p style="color:red">
                ${escapeHTML(
                    error.message
                )}
            </p>`;

        return;

    }


    box.innerHTML = "";


    if(data.length === 0){

        box.innerHTML =
            `<p style="color:#777">
                No applications.
            </p>`;

        return;

    }


    data.forEach(app => {

        const item =
            document.createElement(
                "div"
            );

        item.className =
            "application";


        const date =
            new Date(
                app.created_at
            ).toLocaleString(
                "cs-CZ"
            );


        item.innerHTML = `

            <h3>
                ${escapeHTML(
                    app.nick
                )}
            </h3>

            <p>
                <b>Discord:</b>
                ${escapeHTML(
                    app.discord
                )}
            </p>

            <p>
                <b>Clip:</b>

                <a
                    href="${escapeHTML(
                        app.clip
                    )}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    OPEN CLIP
                </a>
            </p>

            <p>
                <b>About:</b>
                ${escapeHTML(
                    app.about
                )}
            </p>

            <p style="
                font-size:12px;
                color:#555;
            ">
                ${escapeHTML(
                    date
                )}
            </p>

            <button
                class="small-btn accept"
                onclick="acceptApplication(${app.id})"
            >
                ACCEPT
            </button>

            <button
                class="small-btn reject"
                onclick="rejectApplication(${app.id})"
            >
                REJECT
            </button>

        `;


        box.appendChild(item);

    });

}


/* ==================================================
   ACCEPT APPLICATION
================================================== */

async function acceptApplication(id){

    const {
        data:app,
        error
    } = await supabaseClient

        .from("applications")

        .select("*")

        .eq(
            "id",
            id
        )

        .single();


    if(error || !app){

        alert(
            "Application nenalezena."
        );

        return;

    }


    if(
        !confirm(
            "Přijmout " +
            app.nick +
            " do RÆVEN?"
        )
    ){

        return;

    }


    const {
        data:existing
    } = await supabaseClient

        .from("members")

        .select("id")

        .ilike(
            "name",
            app.nick
        );


    if(!existing || existing.length === 0){

        const {
            error:insertError
        } = await supabaseClient

            .from("members")

            .insert({

                name:app.nick,

                role:"MEMBER",

                emoji:"💀",

                protected:false,

                instagram:""

            });


        if(insertError){

            alert(
                "Nelze přidat člena: " +
                insertError.message
            );

            return;

        }

    }


    const {
        error:deleteError
    } = await supabaseClient

        .from("applications")

        .delete()

        .eq(
            "id",
            id
        );


    if(deleteError){

        alert(
            "Application se nepodařilo odstranit."
        );

        return;

    }


    alert(
        app.nick +
        " je nyní člen RÆVEN! 🔥"
    );


    await loadMembers();

    await loadApplications();

    await loadStaffMembers();

}


/* ==================================================
   REJECT
================================================== */

async function rejectApplication(id){

    if(
        !confirm(
            "Odmítnout tuto application?"
        )
    ){

        return;

    }


    const {
        error
    } = await supabaseClient

        .from("applications")

        .delete()

        .eq(
            "id",
            id
        );


    if(error){

        alert(
            "ERROR: " +
            error.message
        );

        return;

    }


    await loadApplications();

}


/* ==================================================
   STAFF MEMBERS
================================================== */

async function loadStaffMembers(){

    const box =
        document.getElementById(
            "clanMembersList"
        );


    const {
        data,
        error
    } = await supabaseClient

        .from("members")

        .select("*")

        .order(
            "id",
            {
                ascending:true
            }
        );


    if(error){

        box.innerHTML =
            `<p style="color:red">
                ${escapeHTML(
                    error.message
                )}
            </p>`;

        return;

    }


    box.innerHTML = "";


    data.forEach(member => {

        const item =
            document.createElement(
                "div"
            );

        item.className =
            "staff-member";


        if(member.protected){

            item.innerHTML = `

                <h3>
                    ${escapeHTML(
                        member.emoji
                    )}

                    ${escapeHTML(
                        member.name
                    )}
                </h3>

                <p style="
                    color:#ff3030;
                ">
                    ${escapeHTML(
                        member.role
                    )}
                </p>

                <p style="
                    color:#777;
                    margin-top:8px;
                ">
                    OWNER — PROTECTED 👑
                </p>

            `;

        }else{

            item.innerHTML = `

                <h3>
                    ${escapeHTML(
                        member.emoji
                    )}

                    ${escapeHTML(
                        member.name
                    )}
                </h3>

                <p style="
                    color:#ff3030;
                ">
                    ${escapeHTML(
                        member.role
                    )}
                </p>

                <button
                    class="small-btn kick"
                    onclick="kickMember(${member.id})"
                >
                    KICK
                </button>

            `;

        }


        box.appendChild(item);

    });

}


/* ==================================================
   KICK
================================================== */

async function kickMember(id){

    const {
        data:member,
        error:findError
    } = await supabaseClient

        .from("members")

        .select("*")

        .eq(
            "id",
            id
        )

        .single();


    if(findError || !member){

        alert(
            "Member nenalezen."
        );

        return;

    }


    if(member.protected){

        alert(
            "MONARCH NELZE VYHODIT 👑"
        );

        return;

    }


    if(
        !confirm(
            "Vyhodit " +
            member.name +
            " z RÆVEN?"
        )
    ){

        return;

    }


    const {
        error
    } = await supabaseClient

        .from("members")

        .delete()

        .eq(
            "id",
            id
        );


    if(error){

        alert(
            "ERROR: " +
            error.message
        );

        return;

    }


    await loadMembers();

    await loadStaffMembers();

}


/* ==================================================
   REALTIME
================================================== */

supabaseClient

.channel("raven-live")

.on(
    "postgres_changes",
    {
        event:"*",
        schema:"public",
        table:"members"
    },
    async () => {

        await loadMembers();

        const panel =
            document
            .getElementById(
                "staffPanel"
            );

        if(
            panel.style.display ===
            "block"
        ){

            await loadStaffMembers();

        }

    }
)

.on(
    "postgres_changes",
    {
        event:"*",
        schema:"public",
        table:"applications"
    },
    async () => {

        const panel =
            document
            .getElementById(
                "staffPanel"
            );

        if(

        ){

            await loadApplications();

        }

)
