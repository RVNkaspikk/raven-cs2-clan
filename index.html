<script>

/* =========================================
   RAVEN DATA
========================================= */

let applications =
    JSON.parse(
        localStorage.getItem("ravenApplications") || "[]"
    );


let clanMembers =
    JSON.parse(
        localStorage.getItem("ravenClanMembers") || "null"
    );


/* =========================================
   DEFAULT MEMBERS
========================================= */

if (!Array.isArray(clanMembers)) {

    clanMembers = [

        {
            name: "MONARCH",
            role: "OWNER",
            protected: true
        },

        {
            name: "RENOX",
            role: "MEMBER",
            protected: false
        },

        {
            name: "KASPIKK",
            role: "MEMBER",
            protected: false
        }

    ];

    saveClan();

}


/* =========================================
   SAVE DATA
========================================= */

function saveClan() {

    localStorage.setItem(
        "ravenClanMembers",
        JSON.stringify(clanMembers)
    );

}


function saveApplications() {

    localStorage.setItem(
        "ravenApplications",
        JSON.stringify(applications)
    );

}


/* =========================================
   INSTAGRAM
========================================= */

function openInstagram(url) {

    window.open(
        url,
        "_blank"
    );

}


/* =========================================
   INSTAGRAM LINKS
========================================= */

const instagramLinks = {

    "MONARCH":
        "https://www.instagram.com/owner_monarch._fihh/",

    "RENOX":
        "https://www.instagram.com/member_rvn_renox/",

    "KASPIKK":
        "https://www.instagram.com/RVN_kaspikk/"

};


/* =========================================
   SHOW MEMBERS ON TOP OF WEBSITE
========================================= */

function showTopMembers() {

    const box =
        document.getElementById(
            "membersList"
        );


    if (!box) return;


    box.innerHTML = "";


    clanMembers.forEach(
        function(member) {

            const instagram =
                instagramLinks[member.name] || "#";


            const letter =
                member.name
                .charAt(0)
                .toUpperCase();


            box.innerHTML += `

                <div
                    class="member-card"
                    ${
                        instagram !== "#"
                        ?
                        `onclick="openInstagram('${instagram}')"`
                        :
                        ""
                    }
                >

                    ${
                        member.protected
                        ?
                        `
                        <div class="crown">
                            👑
                        </div>
                        `
                        :
                        ""
                    }


                    <div class="member-badge">

                        ${
                            member.protected
                            ?
                            "OWNER"
                            :
                            "MEMBER"
                        }

                    </div>


                    <div class="avatar">

                        ${escapeHTML(letter)}

                    </div>


                    <h3>

                        ${escapeHTML(member.name)}

                    </h3>


                    <div class="member-role">

                        RAVEN

                        ${
                            member.protected
                            ?
                            "OWNER"
                            :
                            "MEMBER"
                        }

                    </div>


                    <div class="instagram">

                        ${
                            instagram !== "#"
                            ?
                            instagram
                            :
                            "RAVEN MEMBER"
                        }

                    </div>

                </div>

            `;

        }
    );

}


/* =========================================
   SEND APPLICATION
========================================= */

function sendApplication(event) {

    event.preventDefault();


    const form =
        event.target;


    const inputs =
        form.querySelectorAll("input");


    const textarea =
        form.querySelector("textarea");


    const application = {

        nick:
            inputs[0].value.trim(),

        discord:
            inputs[1].value.trim(),

        clip:
            inputs[2].value.trim(),

        about:
            textarea.value.trim(),

        date:
            new Date().toLocaleString()

    };


    applications.push(
        application
    );


    saveApplications();


    alert(
        "APPLICATION SENT!"
    );


    form.reset();

}


/* =========================================
   STAFF LOGIN
========================================= */

function staffLogin() {

    const password =
        document.getElementById(
            "staffPassword"
        ).value;


    const message =
        document.getElementById(
            "staffMessage"
        );


    const panel =
        document.getElementById(
            "staffPanel"
        );


    if (password !== "raven123") {

        message.style.color =
            "#ff2222";

        message.textContent =
            "✕ WRONG PASSWORD";

        panel.style.display =
            "none";

        return;

    }


    message.style.color =
        "#00ff66";

    message.textContent =
        "✓ STAFF ACCESS GRANTED";


    panel.style.display =
        "block";


    showApplications();

    showClanMembers();

}


/* =========================================
   SHOW APPLICATIONS
========================================= */

function showApplications() {

    const box =
        document.getElementById(
            "applications"
        );


    if (!box) return;


    box.innerHTML = "";


    if (applications.length === 0) {

        box.innerHTML = `

            <div class="no-applications">

                NO APPLICATIONS

            </div>

        `;

        return;

    }


    applications.forEach(
        function(app, index) {

            box.innerHTML += `

                <div class="application">

                    <div class="application-header">

                        <h3>

                            ${escapeHTML(
                                app.nick
                            )}

                        </h3>


                        <span class="pending">

                            PENDING

                        </span>

                    </div>


                    <p>

                        <strong>
                            Discord:
                        </strong>

                        ${escapeHTML(
                            app.discord
                        )}

                    </p>


                    <p>

                        <strong>
                            About:
                        </strong>

                        <br>

                        ${escapeHTML(
                            app.about
                        )}

                    </p>


                    ${
                        app.clip
                        ?

                        `

                        <a
                            class="clip-button"
                            href="${escapeAttribute(app.clip)}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >

                            🎬 WATCH CLIP

                        </a>

                        `

                        :

                        `

                        <div class="clip-button">

                            NO CLIP PROVIDED

                        </div>

                        `
                    }


                    <div class="application-buttons">


                        <button
                            class="accept"
                            onclick="acceptApplication(${index})"
                        >

                            ✓ ACCEPT

                        </button>


                        <button
                            class="reject"
                            onclick="rejectApplication(${index})"
                        >

                            ✕ REJECT

                        </button>


                    </div>


                    <div class="date">

                        ${escapeHTML(
                            app.date || ""
                        )}

                    </div>

                </div>

            `;

        }
    );

}


/* =========================================
   ACCEPT APPLICATION
========================================= */

function acceptApplication(index) {

    const app =
        applications[index];


    if (!app) return;


    const confirmed =
        confirm(
            "Accept " +
            app.nick +
            " into RAVEN?"
        );


    if (!confirmed) return;


    const alreadyMember =
        clanMembers.some(
            function(member) {

                return (

                    member.name
                    .toLowerCase()

                    ===

                    app.nick
                    .toLowerCase()

                );

            }
        );


    if (!alreadyMember) {

        clanMembers.push({

            name:
                app.nick,

            role:
                "MEMBER",

            protected:
                false

        });

    }


    applications.splice(
        index,
        1
    );


    saveApplications();

    saveClan();


    alert(
        app.nick +
        " HAS BEEN ACCEPTED INTO RAVEN!"
    );


    showApplications();

    showClanMembers();

    showTopMembers();

}


/* =========================================
   REJECT APPLICATION
========================================= */

function rejectApplication(index) {

    const app =
        applications[index];


    if (!app) return;


    const confirmed =
        confirm(
            "Reject " +
            app.nick +
            "'s application?"
        );


    if (!confirmed) return;


    applications.splice(
        index,
        1
    );


    saveApplications();


    alert(
        app.nick +
        " HAS BEEN REJECTED!"
    );


    showApplications();

}


/* =========================================
   SHOW CLAN MEMBERS IN STAFF PANEL
========================================= */

function showClanMembers() {

    const box =
        document.getElementById(
            "clanMembers"
        );


    if (!box) return;


    box.innerHTML = "";


    if (clanMembers.length === 0) {

        box.innerHTML = `

            <div class="no-applications">

                NO CLAN MEMBERS

            </div>

        `;

        return;

    }


    clanMembers.forEach(
        function(member, index) {

            box.innerHTML += `

                <div class="clan-member">


                    <div>

                        <div class="clan-member-name">

                            ${
                                member.protected
                                ?
                                "👑 "
                                :
                                ""
                            }

                            ${escapeHTML(
                                member.name
                            )}

                        </div>


                        <div class="clan-member-role">

                            ${escapeHTML(
                                member.role
                            )}

                        </div>

                    </div>


                    ${
                        member.protected

                        ?

                        `

                        <div class="owner-label">

                            OWNER

                        </div>

                        `

                        :

                        `

                        <button
                            class="kick-button"
                            onclick="kickMember(${index})"
                        >

                            KICK

                        </button>

                        `
                    }


                </div>

            `;

        }
    );

}


/* =========================================
   KICK MEMBER
========================================= */

function kickMember(index) {

    const member =
        clanMembers[index];


    if (!member) return;


    if (member.protected) {

        alert(
            "MONARCH IS THE OWNER AND CANNOT BE KICKED!"
        );

        return;

    }


    const confirmed =
        confirm(
            "KICK " +
            member.name +
            " FROM RAVEN?"
        );


    if (!confirmed) return;


    const kickedName =
        member.name;


    clanMembers.splice(
        index,
        1
    );


    saveClan();


    alert(
        kickedName +
        " HAS BEEN KICKED FROM RAVEN!"
    );


    showClanMembers();

    showTopMembers();

}


/* =========================================
   SECURITY
========================================= */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}


/* =========================================
   LOAD EVERYTHING
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        showTopMembers();

    }
);

</script>
