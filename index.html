<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RÆVEN — CS2 Clan</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #050505;
    color: white;
    overflow-x: hidden;
}

/* BACKGROUND */
.bg {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -5;
    background:
        radial-gradient(circle at 50% 20%, rgba(255,0,0,.15), transparent 35%),
        #050505;
}

.dot {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    opacity: .5;
    animation: float 10s linear infinite;
}

@keyframes float {
    from {
        transform: translateY(110vh);
    }
    to {
        transform: translateY(-10vh);
    }
}

/* NAVBAR */
nav {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 40px);
    max-width: 1100px;
    padding: 14px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(15,15,15,.75);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px;
    z-index: 1000;
    box-shadow: 0 0 30px rgba(255,0,0,.08);
}

.logo {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 4px;
    color: white;
}

.logo span {
    color: #ff1a1a;
}

nav a {
    color: #aaa;
    text-decoration: none;
    margin-left: 25px;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
    transition: .2s;
}

nav a:hover {
    color: #ff2222;
}

/* HERO */
.hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 100px 20px 40px;
}

.hero-content {
    animation: heroIn 1s ease;
}

@keyframes heroIn {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.hero h1 {
    font-size: clamp(70px, 15vw, 190px);
    line-height: .8;
    font-weight: 1000;
    letter-spacing: -8px;
    color: white;
    text-shadow:
        0 0 20px rgba(255,0,0,.3),
        0 0 70px rgba(255,0,0,.12);
}

.hero h1 span {
    color: #ff1717;
}

.hero p {
    margin-top: 30px;
    color: #888;
    font-size: 15px;
    letter-spacing: 5px;
}

.btn {
    display: inline-block;
    margin-top: 35px;
    padding: 15px 32px;
    border-radius: 10px;
    background: #ff1717;
    color: white;
    text-decoration: none;
    font-weight: 900;
    letter-spacing: 2px;
    border: none;
    cursor: pointer;
    transition: .25s;
    box-shadow: 0 0 30px rgba(255,0,0,.25);
}

.btn:hover {
    transform: translateY(-3px);
    background: #ff3030;
    box-shadow: 0 0 45px rgba(255,0,0,.4);
}

/* SECTIONS */
section {
    width: 100%;
    max-width: 1150px;
    margin: auto;
    padding: 110px 25px;
}

.section-title {
    text-align: center;
    margin-bottom: 55px;
}

.section-title h2 {
    font-size: 45px;
    font-weight: 1000;
    letter-spacing: 3px;
}

.section-title h2 span {
    color: #ff1717;
}

.section-title p {
    color: #777;
    margin-top: 10px;
}

/* MEMBERS */
.members {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.member-card {
    position: relative;
    padding: 35px 20px;
    text-align: center;
    background: rgba(20,20,20,.65);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 18px;
    backdrop-filter: blur(15px);
    cursor: pointer;
    transition: .3s;
    overflow: hidden;
}

.member-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 2px;
    background: #ff1717;
    transition: .4s;
}

.member-card:hover::before {
    left: 0;
}

.member-card:hover {
    transform: translateY(-7px);
    border-color: rgba(255,0,0,.35);
    box-shadow: 0 15px 50px rgba(255,0,0,.1);
}

.member-emoji {
    font-size: 35px;
    margin-bottom: 12px;
}

.member-name {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 2px;
}

.member-role {
    color: #ff2020;
    margin-top: 8px;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
}

/* JOIN */
.join-box {
    max-width: 650px;
    margin: auto;
    padding: 35px;
    background: rgba(15,15,15,.75);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 20px;
    backdrop-filter: blur(15px);
}

.input {
    width: 100%;
    margin-bottom: 15px;
}

.input input,
.input textarea {
    width: 100%;
    padding: 15px;
    background: #0b0b0b;
    color: white;
    border: 1px solid #222;
    border-radius: 9px;
    outline: none;
    font-family: inherit;
    transition: .2s;
}

.input textarea {
    min-height: 130px;
    resize: vertical;
}

.input input:focus,
.input textarea:focus {
    border-color: #ff1717;
    box-shadow: 0 0 15px rgba(255,0,0,.1);
}

.join-box .btn {
    width: 100%;
}

/* STAFF */
.staff-login {
    max-width: 400px;
    margin: auto;
    text-align: center;
}

.staff-login input {
    width: 100%;
    padding: 15px;
    background: #0b0b0b;
    border: 1px solid #222;
    color: white;
    border-radius: 9px;
    outline: none;
    margin-bottom: 10px;
}

.staff-panel {
    display: none;
}

.panel-box {
    background: rgba(15,15,15,.75);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px;
    padding: 25px;
    margin-bottom: 25px;
}

.panel-box h3 {
    margin-bottom: 20px;
    color: #ff1717;
}

.application {
    padding: 20px;
    margin-bottom: 15px;
    background: #0b0b0b;
    border: 1px solid #222;
    border-radius: 12px;
}

.application:last-child {
    margin-bottom: 0;
}

.application strong {
    color: #ff2222;
}

.application p {
    color: #aaa;
    margin: 7px 0;
    word-break: break-word;
}

.application a {
    color: #ff4444;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.accept,
.reject,
.kick {
    border: none;
    padding: 10px 15px;
    border-radius: 7px;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.accept {
    background: #15803d;
}

.reject,
.kick {
    background: #b91c1c;
}

.accept:hover,
.reject:hover,
.kick:hover {
    filter: brightness(1.2);
}

.staff-member {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 15px;
    margin-bottom: 10px;
    background: #0b0b0b;
    border-radius: 10px;
    border: 1px solid #222;
}

.staff-member-name {
    font-weight: bold;
}

.staff-member-role {
    color: #ff2222;
    font-size: 11px;
    margin-left: 5px;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 80px 20px;
    border-top: 1px solid #151515;
    color: #555;
    letter-spacing: 5px;
    font-weight: 900;
}

footer span {
    color: #ff1717;
}

/* MOBILE */
@media(max-width: 650px) {
    nav {
        width: calc(100% - 20px);
        padding: 12px 15px;
    }

    nav a {
        margin-left: 10px;
        font-size: 10px;
    }

    .logo {
        font-size: 18px;
    }

    .hero h1 {
        letter-spacing: -4px;
    }

    .join-box {
        padding: 20px;
    }

    .actions {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="bg" id="background"></div>

<nav>
    <div class="logo">R<span>Æ</span>VEN</div>

    <div>
        <a href="#home">HOME</a>
        <a href="#members">MEMBERS</a>
        <a href="#join">JOIN</a>
        <a href="#staff">STAFF</a>
    </div>
</nav>

<!-- HOME -->
<div class="hero" id="home">
    <div class="hero-content">
        <h1>R<span>Æ</span>VEN</h1>
        <p>CS2 CLAN • NO MERCY</p>

        <a class="btn" href="#join">JOIN RÆVEN</a>
    </div>
</div>

<!-- MEMBERS -->
<section id="members">

    <div class="section-title">
        <h2>OUR <span>MEMBERS</span></h2>
        <p>Meet the RÆVEN squad.</p>
    </div>

    <div class="members" id="membersList">
        <p style="color:#777;text-align:center;">Loading members...</p>
    </div>

</section>

<!-- JOIN -->
<section id="join">

    <div class="section-title">
        <h2>JOIN <span>RÆVEN</span></h2>
        <p>Think you have what it takes?</p>
    </div>

    <div class="join-box">

        <form id="joinForm">

            <div class="input">
                <input
                    type="text"
                    id="nick"
                    placeholder="CS2 Nickname"
                    required
                >
            </div>

            <div class="input">
                <input
                    type="text"
                    id="discord"
                    placeholder="Discord"
                    required
                >
            </div>

            <div class="input">
                <input
                    type="url"
                    id="clip"
                    placeholder="Clip URL"
                    required
                >
            </div>

            <div class="input">
                <textarea
                    id="about"
                    placeholder="Tell us about yourself..."
                    required
                ></textarea>
            </div>

            <button class="btn" type="submit">
                SEND APPLICATION
            </button>

        </form>

        <p id="joinStatus"
           style="text-align:center;margin-top:15px;color:#777;">
        </p>

    </div>

</section>

<!-- STAFF -->
<section id="staff">

    <div class="section-title">
        <h2><span>STAFF</span> PANEL</h2>
        <p>RÆVEN administration.</p>
    </div>

    <div class="staff-login" id="staffLogin">

        <input
            type="password"
            id="staffPassword"
            placeholder="Staff password"
        >

        <button class="btn" onclick="loginStaff()">
            LOGIN
        </button>

        <p id="loginStatus"
           style="margin-top:12px;color:#777;">
        </p>

    </div>

    <div class="staff-panel" id="staffPanel">

        <div class="panel-box">

            <h3>APPLICATIONS</h3>

            <div id="applicationsList">
                Loading...
            </div>

        </div>

        <div class="panel-box">

            <h3>MEMBERS</h3>

            <div id="staffMembersList">
                Loading...
            </div>

        </div>

    </div>

</section>

<footer>
    <span>RÆVEN</span> ON TOP
</footer>

<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://mrctqcrcbmbsamfevmii.supabase.co";

/*
   SEM VLOŽ SVŮJ SUPABASE PUBLISHABLE KEY
*/
const SUPABASE_KEY =
    "SEM_VLOZ_SVŮJ_PUBLISHABLE_KEY";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   BACKGROUND DOTS
   ========================================================= */

const background =
    document.getElementById("background");

for (let i = 0; i < 70; i++) {

    const dot = document.createElement("div");

    dot.className = "dot";

    dot.style.left =
        Math.random() * 100 + "%";

    dot.style.animationDuration =
        (5 + Math.random() * 12) + "s";

    dot.style.animationDelay =
        Math.random() * 10 + "s";

    dot.style.opacity =
        0.2 + Math.random() * 0.6;

    background.appendChild(dot);
}


/* =========================================================
   MEMBER EMOJI
   ========================================================= */

function getEmoji(member) {

    if (member.name.toUpperCase() === "MONARCH") {
        return "👑";
    }

    if (
        member.name.toUpperCase() === "RENOX" ||
        member.name.toUpperCase() === "KASPIKK"
    ) {
        return "🗿";
    }

    return "💀";
}


/* =========================================================
   LOAD MEMBERS
   ========================================================= */

async function loadMembers() {

    const list =
        document.getElementById("membersList");

    const {
        data,
        error
    } = await supabaseClient
        .from("members")
        .select("*")
        .order("id", {
            ascending: true
        });

    if (error) {

        console.error(error);

        list.innerHTML =
            `<p style="color:#ff3333;text-align:center;">
                Failed to load members.
            </p>`;

        return;
    }

    if (!data || data.length === 0) {

        list.innerHTML =
            `<p style="color:#777;text-align:center;">
                No members yet.
            </p>`;

        return;
    }

    list.innerHTML = "";

    data.forEach(member => {

        const card =
            document.createElement("div");

        card.className = "member-card";

        const emoji =
            member.emoji || getEmoji(member);

        card.innerHTML = `
            <div class="member-emoji">
                ${emoji}
            </div>

            <div class="member-name">
                ${escapeHTML(member.name)}
            </div>

            <div class="member-role">
                ${escapeHTML(member.role)}
            </div>
        `;

        if (member.instagram) {

            card.addEventListener(
                "click",
                () => {
                    window.open(
                        member.instagram,
                        "_blank"
                    );
                }
            );

        }

        list.appendChild(card);

    });

    loadStaffMembers();
}


/* =========================================================
   JOIN APPLICATION
   ========================================================= */

const joinForm =
    document.getElementById("joinForm");

joinForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const status =
            document.getElementById("joinStatus");

        const nick =
            document.getElementById("nick").value.trim();

        const discord =
            document.getElementById("discord").value.trim();

        const clip =
            document.getElementById("clip").value.trim();

        const about =
            document.getElementById("about").value.trim();

        if (!nick || !discord || !clip || !about) {

            status.style.color = "#ff3333";
            status.textContent =
                "Fill in everything.";

            return;
        }

        status.style.color = "#aaa";
        status.textContent =
            "Sending application...";

        const {
            error
        } = await supabaseClient
            .from("applications")
            .insert({
                nick: nick,
                discord: discord,
                clip: clip,
                about: about
            });

        if (error) {

            console.error(error);

            status.style.color = "#ff3333";
            status.textContent =
                "Something went wrong.";

            return;
        }

        status.style.color = "#36ff75";
        status.textContent =
            "Application sent successfully!";

        joinForm.reset();

        loadApplications();

    }
);


/* =========================================================
   STAFF LOGIN
   ========================================================= */

const STAFF_PASSWORD =
    "raven123";

function loginStaff() {

    const password =
        document.getElementById("staffPassword").value;

    const status =
        document.getElementById("loginStatus");

    if (password === STAFF_PASSWORD) {

        document.getElementById("staffLogin")
            .style.display = "none";

        document.getElementById("staffPanel")
            .style.display = "block";

        loadApplications();
        loadStaffMembers();

    } else {

        status.style.color = "#ff3333";
        status.textContent =
            "Wrong password.";

    }
}


/* =========================================================
   LOAD APPLICATIONS
   ========================================================= */

async function loadApplications() {

    const list =
        document.getElementById("applicationsList");

    if (!list) return;

    const {
        data,
        error
    } = await supabaseClient
        .from("applications")
        .select("*")
        .order("created_at", {
            ascending: false
        });

    if (error) {

        console.error(error);

        list.innerHTML =
            `<p style="color:#ff3333;">
                Failed to load applications.
            </p>`;

        return;
    }

    if (!data || data.length === 0) {

        list.innerHTML =
            `<p style="color:#777;">
                No applications.
            </p>`;

        return;
    }

    list.innerHTML = "";

    data.forEach(app => {

        const box =
            document.createElement("div");

        box.className = "application";

        box.innerHTML = `

            <strong>
                ${escapeHTML(app.nick)}
            </strong>

            <p>
                Discord:
                ${escapeHTML(app.discord)}
            </p>

            <p>
                About:
                ${escapeHTML(app.about)}
            </p>

            <p>
                Clip:
                <a
                    href="${safeURL(app.clip)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Open Clip
                </a>
            </p>

            <div class="actions">

                <button
                    class="accept"
                    onclick="acceptApplication(${app.id})"
                >
                    ACCEPT
                </button>

                <button
                    class="reject"
                    onclick="rejectApplication(${app.id})"
                >
                    REJECT
                </button>

            </div>
        `;

        list.appendChild(box);

    });
}


/* =========================================================
   ACCEPT APPLICATION
   ========================================================= */

async function acceptApplication(id) {

    const {
        data: application,
        error: getError
    } = await supabaseClient
        .from("applications")
        .select("*")
        .eq("id", id)
        .single();

    if (getError || !application) {

        alert("Application not found.");

        return;
    }

    const confirmed =
        confirm(
            `Accept ${application.nick} into RÆVEN?`
        );

    if (!confirmed) return;

    const {
        error: memberError
    } = await supabaseClient
        .from("members")
        .insert({
            name: application.nick,
            role: "MEMBER",
            emoji: "💀",
            protected: false,
            instagram: ""
        });

    if (memberError) {

        console.error(memberError);

        if (
            memberError.code === "23505"
        ) {
            alert(
                "This member already exists."
            );
        } else {
            alert(
                "Could not add member."
            );
        }

        return;
    }

    const {
        error: deleteError
    } = await supabaseClient
        .from("applications")
        .delete()
        .eq("id", id);

    if (deleteError) {

        console.error(deleteError);

        alert(
            "Member added, but application could not be deleted."
        );

        return;
    }

    alert(
        `${application.nick} is now a RÆVEN member!`
    );

    await refreshEverything();
}


/* =========================================================
   REJECT APPLICATION
   ========================================================= */

async function rejectApplication(id) {

    const confirmed =
        confirm(
            "Reject this application?"
        );

    if (!confirmed) return;

    const {
        error
    } = await supabaseClient
        .from("applications")
        .delete()
        .eq("id", id);

    if (error) {

        console.error(error);

        alert(
            "Could not reject application."
        );

        return;
    }

    await refreshEverything();
}


/* =========================================================
   LOAD STAFF MEMBERS
   ========================================================= */

async function loadStaffMembers() {

    const list =
        document.getElementById(
            "staffMembersList"
        );

    if (!list) return;

    const {
        data,
        error
    } = await supabaseClient
        .from("members")
        .select("*")
        .order("id", {
            ascending: true
        });

    if (error) {

        console.error(error);

        list.innerHTML =
            `<p style="color:#ff3333;">
                Failed to load members.
            </p>`;

        return;
    }

    if (!data || data.length === 0) {

        list.innerHTML =
            `<p style="color:#777;">
                No members.
            </p>`;

        return;
    }

    list.innerHTML = "";

    data.forEach(member => {

        const row =
            document.createElement("div");

        row.className = "staff-member";

        const left =
            document.createElement("div");

        left.innerHTML = `
            <span class="staff-member-name">
                ${member.emoji || getEmoji(member)}
                ${escapeHTML(member.name)}
            </span>

            <span class="staff-member-role">
                ${escapeHTML(member.role)}
            </span>
        `;

        row.appendChild(left);

        if (!member.protected) {

            const kick =
                document.createElement("button");

            kick.className = "kick";

            kick.textContent = "KICK";

            kick.onclick = () =>
                kickMember(
                    member.id,
                    member.name
                );

            row.appendChild(kick);

        } else {

            const protectedText =
                document.createElement("span");

            protectedText.style.color =
                "#777";

            protectedText.style.fontSize =
                "11px";

            protectedText.textContent =
                "PROTECTED";

            row.appendChild(protectedText);
        }

        list.appendChild(row);

    });
}


/* =========================================================
   KICK MEMBER
   ========================================================= */

async function kickMember(id, name) {

    if (
        name.toUpperCase() === "MONARCH"
    ) {
        alert(
            "MONARCH is protected and cannot be kicked."
        );

        return;
    }

    const confirmed =
        confirm(
            `Kick ${name} from RÆVEN?`
        );

    if (!confirmed) return;

    const {
        error
    } = await supabaseClient
        .from("members")
        .delete()
        .eq("id", id);

    if (error) {

        console.error(error);

        alert(
            "Could not kick member."
        );

        return;
    }

    await refreshEverything();
}


/* =========================================================
   REFRESH EVERYTHING
   ========================================================= */

async function refreshEverything() {

    await loadMembers();
    await loadApplications();
    await loadStaffMembers();

}


/* =========================================================
   REALTIME
   ========================================================= */

supabaseClient
    .channel("raven-members")
    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "members"
        },
        () => {
            loadMembers();
            loadStaffMembers();
        }
    )
    .subscribe();


supabaseClient
    .channel("raven-applications")
    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "applications"
        },
        () => {
            loadApplications();
        }
    )
    .subscribe();


/* =========================================================
   SECURITY / HTML HELPERS
   ========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function safeURL(value) {

    try {

        const url =
            new URL(value);

        if (
            url.protocol === "http:" ||
            url.protocol === "https:"
        ) {
            return url.href;
        }

    } catch (e) {}

    return "#";
}
