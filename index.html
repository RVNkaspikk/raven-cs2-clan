<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RÆVEN — CS2 Clan</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #050505;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

.background {
    position: fixed;
    inset: 0;
    z-index: -5;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 15%, rgba(255,0,0,.18), transparent 35%),
        #050505;
}

.dot {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    opacity: .5;
    animation: float linear infinite;
}

@keyframes float {
    from { transform: translateY(110vh); }
    to { transform: translateY(-10vh); }
}

nav {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 40px);
    max-width: 1100px;
    padding: 15px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(15,15,15,.78);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px;
    z-index: 1000;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 4px;
}

.logo span {
    color: #ff1616;
}

nav a {
    color: #aaa;
    text-decoration: none;
    margin-left: 22px;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 1px;
    transition: .2s;
}

nav a:hover {
    color: #ff1b1b;
}

.hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 100px 20px 40px;
}

.hero h1 {
    font-size: clamp(75px, 15vw, 190px);
    line-height: .8;
    font-weight: 1000;
    letter-spacing: -8px;
    text-shadow:
        0 0 25px rgba(255,0,0,.3),
        0 0 80px rgba(255,0,0,.1);
}

.hero h1 span {
    color: #ff1717;
}

.hero p {
    margin-top: 30px;
    color: #888;
    letter-spacing: 5px;
}

.btn {
    display: inline-block;
    margin-top: 35px;
    padding: 15px 32px;
    background: #ff1717;
    color: white;
    border: none;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
    transition: .25s;
    box-shadow: 0 0 30px rgba(255,0,0,.25);
}

.btn:hover {
    transform: translateY(-3px);
    background: #ff3030;
}

section {
    width: 100%;
    max-width: 1150px;
    margin: auto;
    padding: 110px 25px;
}

.section-title {
    text-align: center;
    margin-bottom: 55px;
}

.section-title h2 {
    font-size: 45px;
    font-weight: 1000;
    letter-spacing: 3px;
}

.section-title h2 span {
    color: #ff1717;
}

.section-title p {
    margin-top: 10px;
    color: #777;
}

.members {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.member-card {
    padding: 35px 20px;
    text-align: center;
    background: rgba(20,20,20,.72);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 18px;
    backdrop-filter: blur(15px);
    cursor: pointer;
    transition: .3s;
}

.member-card:hover {
    transform: translateY(-7px);
    border-color: rgba(255,0,0,.45);
    box-shadow: 0 15px 50px rgba(255,0,0,.13);
}

.member-emoji {
    font-size: 38px;
    margin-bottom: 12px;
}

.member-name {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 2px;
}

.member-role {
    margin-top: 8px;
    color: #ff2020;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
}

.join-box {
    max-width: 650px;
    margin: auto;
    padding: 35px;
    background: rgba(15,15,15,.75);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 20px;
    backdrop-filter: blur(15px);
}

.input {
    margin-bottom: 15px;
}

.input input,
.input textarea {
    width: 100%;
    padding: 15px;
    background: #0b0b0b;
    color: white;
    border: 1px solid #222;
    border-radius: 9px;
    outline: none;
    font-family: inherit;
}

.input textarea {
    min-height: 130px;
    resize: vertical;
}

.input input:focus,
.input textarea:focus {
    border-color: #ff1717;
}

.join-box .btn {
    width: 100%;
}

.staff-login {
    max-width: 400px;
    margin: auto;
    text-align: center;
}

.staff-login input {
    width: 100%;
    padding: 15px;
    margin-bottom: 10px;
    background: #0b0b0b;
    color: white;
    border: 1px solid #222;
    border-radius: 9px;
    outline: none;
}

.staff-panel {
    display: none;
}

.panel-box {
    padding: 25px;
    margin-bottom: 25px;
    background: rgba(15,15,15,.75);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px;
}

.panel-box h3 {
    color: #ff1717;
    margin-bottom: 20px;
}

.application {
    padding: 20px;
    margin-bottom: 15px;
    background: #0b0b0b;
    border: 1px solid #222;
    border-radius: 12px;
}

.application strong {
    color: #ff2222;
}

.application p {
    color: #aaa;
    margin: 7px 0;
    word-break: break-word;
}

.application a {
    color: #ff4444;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.accept,
.reject,
.kick {
    border: none;
    padding: 10px 15px;
    border-radius: 7px;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.accept {
    background: #15803d;
}

.reject,
.kick {
    background: #b91c1c;
}

.staff-member {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px;
    margin-bottom: 10px;
    background: #0b0b0b;
    border: 1px solid #222;
    border-radius: 10px;
}

.staff-member-role {
    color: #ff2222;
    font-size: 11px;
    margin-left: 6px;
}

footer {
    padding: 80px 20px;
    text-align: center;
    color: #555;
    letter-spacing: 5px;
    font-weight: 900;
    border-top: 1px solid #151515;
}

footer span {
    color: #ff1717;
}

@media(max-width:650px) {
    nav {
        width: calc(100% - 20px);
        padding: 12px 15px;
    }

    nav a {
        margin-left: 8px;
        font-size: 9px;
    }

    .logo {
        font-size: 18px;
    }

    .hero h1 {
        letter-spacing: -4px;
    }

    .join-box {
        padding: 20px;
    }

    .actions {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="background" id="background"></div>

<nav>
    <div class="logo">R<span>Æ</span>VEN</div>

    <div>
        <a href="#home">HOME</a>
        <a href="#members">MEMBERS</a>
        <a href="#join">JOIN</a>
        <a href="#staff">STAFF</a>
    </div>
</nav>

<div class="hero" id="home">
    <div>
        <h1>R<span>Æ</span>VEN</h1>
        <p>CS2 CLAN • NO MERCY</p>
        <a class="btn" href="#join">JOIN RÆVEN</a>
    </div>
</div>

<section id="members">

    <div class="section-title">
        <h2>OUR <span>MEMBERS</span></h2>
        <p>Meet the RÆVEN squad.</p>
    </div>

    <div class="members" id="membersList">

        <div class="member-card"
             onclick="openInstagram('https://www.instagram.com/owner_monarch._fihh/')">
            <div class="member-emoji">👑</div>
            <div class="member-name">MONARCH</div>
            <div class="member-role">OWNER</div>
        </div>

        <div class="member-card"
             onclick="openInstagram('https://www.instagram.com/member_rvn_renox/')">
            <div class="member-emoji">🗿</div>
            <div class="member-name">RENOX</div>
            <div class="member-role">MEMBER</div>
        </div>

        <div class="member-card"
             onclick="openInstagram('https://www.instagram.com/rvn_kaspikk/')">
            <div class="member-emoji">🗿</div>
            <div class="member-name">KASPIKK</div>
            <div class="member-role">MEMBER</div>
        </div>

    </div>
</section>

<section id="join">

    <div class="section-title">
        <h2>JOIN <span>RÆVEN</span></h2>
        <p>Think you have what it takes?</p>
    </div>

    <div class="join-box">

        <form id="joinForm">

            <div class="input">
                <input id="nick" type="text"
                       placeholder="CS2 Nickname" required>
            </div>

            <div class="input">
                <input id="discord" type="text"
                       placeholder="Discord" required>
            </div>

            <div class="input">
                <input id="clip" type="url"
                       placeholder="Clip URL" required>
            </div>

            <div class="input">
                <textarea id="about"
                          placeholder="Tell us about yourself..."
                          required></textarea>
            </div>

            <button class="btn" type="submit">
                SEND APPLICATION
            </button>

        </form>

        <p id="joinStatus"
           style="text-align:center;margin-top:15px;color:#777;">
        </p>

    </div>
</section>

<section id="staff">

    <div class="section-title">
        <h2><span>STAFF</span> PANEL</h2>
        <p>RÆVEN administration.</p>
    </div>

    <div class="staff-login" id="staffLogin">

        <input id="staffPassword"
               type="password"
               placeholder="Staff password">

        <button class="btn" onclick="loginStaff()">
            LOGIN
        </button>

        <p id="loginStatus"></p>

    </div>

    <div class="staff-panel" id="staffPanel">

        <div class="panel-box">

            <h3>APPLICATIONS</h3>

            <div id="applicationsList">
                Loading...
            </div>

        </div>

        <div class="panel-box">

            <h3>MEMBERS</h3>

            <div id="staffMembersList">
                Loading...
            </div>

        </div>

    </div>
</section>

<footer>
    <span>RÆVEN</span> ON TOP
</footer>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://mrctqcrcbmbsamfevmii.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_jdrEHYNZqzor4qleQxQ3Aw_M-SyWoWA";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   BACKGROUND
===================================================== */

const background =
    document.getElementById("background");

for (let i = 0; i < 80; i++) {

    const dot = document.createElement("div");

    dot.className = "dot";

    dot.style.left =
        Math.random() * 100 + "%";

    dot.style.animationDuration =
        5 + Math.random() * 12 + "s";

    dot.style.animationDelay =
        Math.random() * 10 + "s";

    background.appendChild(dot);
}


/* =====================================================
   INSTAGRAM
===================================================== */

function openInstagram(url) {

    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );
}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =====================================================
   MEMBER EMOJI
===================================================== */

function getEmoji(member) {

    const name =
        String(member.name || "").toUpperCase();

    if (name === "MONARCH")
        return "👑";

    if (
        name === "RENOX" ||
        name === "KASPIKK"
    )
        return "🗿";

    return "💀";
}


/* =====================================================
   LOAD MEMBERS
===================================================== */

async function loadMembers() {

    const list =
        document.getElementById("membersList");

    try {

        const {
            data,
            error
        } = await supabaseClient
            .from("members")
            .select("*")
            .order("id", {
                ascending: true
            });

        console.log(
            "SUPABASE MEMBERS:",
            data
        );

        if (error) {

            console.error(
                "MEMBERS ERROR:",
                error
            );

            return;
        }

        if (!data || data.length === 0) {
            return;
        }

        list.innerHTML = "";

        data.forEach(member => {

            const card =
                document.createElement("div");

            card.className =
                "member-card";

            card.innerHTML = `

                <div class="member-emoji">
                    ${escapeHTML(
                        member.emoji ||
                        getEmoji(member)
                    )}
                </div>

                <div class="member-name">
                    ${escapeHTML(member.name)}
                </div>

                <div class="member-role">
                    ${escapeHTML(member.role)}
                </div>

            `;

            if (member.instagram) {

                card.onclick = () => {
                    openInstagram(
                        member.instagram
                    );
                };

            }

            list.appendChild(card);

        });

    } catch (error) {

        console.error(
            "MEMBERS LOAD FAILED:",
            error
        );
    }
}


/* =====================================================
   JOIN APPLICATION
===================================================== */

document
    .getElementById("joinForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const status =
                document.getElementById(
                    "joinStatus"
                );

            const nick =
                document.getElementById(
                    "nick"
                ).value.trim();

            const discord =
                document.getElementById(
                    "discord"
                ).value.trim();

            const clip =
                document.getElementById(
                    "clip"
                ).value.trim();

            const about =
                document.getElementById(
                    "about"
                ).value.trim();

            status.style.color = "#777";
            status.textContent =
                "Sending application...";

            const {
                error
            } = await supabaseClient
                .from("applications")
                .insert({
                    nick,
                    discord,
                    clip,
                    about
                });

            if (error) {

                console.error(error);

                status.style.color =
                    "#ff3333";

                status.textContent =
                    error.message;

                return;
            }

            status.style.color =
                "#36ff75";

            status.textContent =
                "Application sent!";

            document
                .getElementById("joinForm")
                .reset();

        }
    );


/* =====================================================
   STAFF LOGIN
===================================================== */

const STAFF_PASSWORD =
    "raven123";

function loginStaff() {

    const password =
        document.getElementById(
            "staffPassword"
        ).value;

    const status =
        document.getElementById(
            "loginStatus"
        );

    if (password !== STAFF_PASSWORD) {

        status.style.color =
            "#ff3333";

        status.textContent =
            "Wrong password.";

        return;
    }

    status.textContent = "";

    document.getElementById(
        "staffLogin"
    ).style.display = "none";

    document.getElementById(
        "staffPanel"
    ).style.display = "block";

    loadApplications();
    loadStaffMembers();
}


/* =====================================================
   APPLICATIONS
   NO created_at HERE
===================================================== */

async function loadApplications() {

    const list =
        document.getElementById(
            "applicationsList"
        );

    const {
        data,
        error
    } = await supabaseClient
        .from("applications")
        .select("*")
        .order("id", {
            ascending: false
        });

    if (error) {

        list.innerHTML =
            `<p style="color:#ff3333;">
                ${escapeHTML(error.message)}
            </p>`;

        return;
    }

    if (!data || data.length === 0) {

        list.innerHTML =
            `<p style="color:#777;">
                No applications.
            </p>`;

        return;
    }

    list.innerHTML = "";

    data.forEach(app => {

        const box =
            document.createElement("div");

        box.className =
            "application";

        box.innerHTML = `

            <strong>
                ${escapeHTML(app.nick)}
            </strong>

            <p>
                Discord:
                ${escapeHTML(app.discord)}
            </p>

            <p>
                About:
                ${escapeHTML(app.about)}
            </p>

            <p>
                Clip:
                <a
                    href="${escapeHTML(app.clip)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Open Clip
                </a>
            </p>

            <div class="actions">

                <button
                    class="accept"
                    onclick="acceptApplication(${app.id})"
                >
                    ACCEPT
                </button>

                <button
                    class="reject"
                    onclick="rejectApplication(${app.id})"
                >
                    REJECT
                </button>

            </div>
        `;

        list.appendChild(box);

    });
}


/* =====================================================
   ACCEPT
===================================================== */

async function acceptApplication(id) {

    const {
        data: app,
        error
    } = await supabaseClient
        .from("applications")
        .select("*")
        .eq("id", id)
        .single();

    if (error || !app) {

        alert("Application not found.");

        return;
    }

    if (
        !confirm(
            `Accept ${app.nick} into RÆVEN?`
        )
    ) return;

    const {
        error: memberError
    } = await supabaseClient
        .from("members")
        .insert({
            name: app.nick,
            role: "MEMBER",
            emoji: "💀",
            protected: false,
            instagram: ""
        });

    if (memberError) {

        alert(
            memberError.message
        );

        return;
    }

    const {
        error: deleteError
    } = await supabaseClient
        .from("applications")
        .delete()
        .eq("id", id);

    if (deleteError) {

        alert(
            deleteError.message
        );

        return;
    }

    loadMembers();
    loadApplications();
    loadStaffMembers();
}


/* =====================================================
   REJECT
===================================================== */

async function rejectApplication(id) {

    if (
        !confirm(
            "Reject this application?"
        )
    ) return;

    const {
        error
    } = await supabaseClient
        .from("applications")
        .delete()
        .eq("id", id);

    if (error) {

        alert(
            error.message
        );

        return;
    }

    loadApplications();
}


/* =====================================================
   STAFF MEMBERS
===================================================== */

async function loadStaffMembers() {

    const list =
        document.getElementById(
            "staffMembersList"
        );

    const {
        data,
        error
    } = await supabaseClient
        .from("members")
        .select("*")
        .order("id", {
            ascending: true
        });

    if (error) {

        list.innerHTML =
            `<p style="color:#ff3333;">
                ${escapeHTML(error.message)}
            </p>`;

        return;
    }

    if (!data || data.length === 0) {

        list.innerHTML =
            `<p style="color:#777;">
                No members.
            </p>`;

        return;
    }

    list.innerHTML = "";

    data.forEach(member => {

        const row =
            document.createElement("div");

        row.className =
            "staff-member";

        row.innerHTML = `
            <div>

                ${escapeHTML(
                    member.emoji ||
                    getEmoji(member)
                )}

                <b>
                    ${escapeHTML(member.name)}
                </b>

                <span class="staff-member-role">
                    ${escapeHTML(member.role)}
                </span>

            </div>
        `;

        if (member.protected) {

            const protectedText =
                document.createElement("span");

            protectedText.style.color =
                "#777";

            protectedText.textContent =
                "PROTECTED";

            row.appendChild(
                protectedText
            );

        } else {

            const kick =
                document.createElement("button");

            kick.className =
                "kick";

            kick.textContent =
                "KICK";

            kick.onclick = () =>
                kickMember(
                    member.id,
                    member.name
                );

            row.appendChild(kick);
        }

        list.appendChild(row);

    });
}


/* =====================================================
   KICK
===================================================== */

async function kickMember(id, name) {

    if (
        name.toUpperCase() ===
        "MONARCH"
    ) {

        alert(
            "MONARCH cannot be kicked."
        );

        return;
    }

    if (
        !confirm(
            `Kick ${name} from RÆVEN?`
        )
    ) return;

    const {
        error
    } = await supabaseClient
        .from("members")
        .delete()
        .eq("id", id);

    if (error) {

        alert(
            error.message
        );

        return;
    }

    loadMembers();
    loadStaffMembers();
}


/* =====================================================
   REALTIME
===================================================== */

supabaseClient
    .channel("raven-members")
    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "members"
        },
        () => {

            loadMembers();

            if (
                document.getElementById(
                    "staffPanel"
                ).style.display === "block"
            ) {
                loadStaffMembers();
            }

        }
    )
    .subscribe();


supabaseClient
    .channel("raven-applications")
    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "applications"
        },
        () => {

            if (
                document.getElementById(
                    "staffPanel"
                ).style.display === "block"
            ) {
                loadApplications();
            }

        }
    )
    .subscribe();


/* =====================================================
   START
===================================================== */

loadMembers();

</script>

</body>
</html>
