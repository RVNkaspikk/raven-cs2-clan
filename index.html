<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAVEN — CS2 CLAN</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}

body {
    font-family: Arial, sans-serif;
    background: #050505;
    color: white;
}

nav {
    position: fixed;
    top: 0;
    width: 100%;
    background: rgba(5,5,5,.95);
    border-bottom: 1px solid #300000;
    padding: 18px;
    text-align: center;
    z-index: 1000;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 20px;
    font-weight: bold;
}

nav a:hover {
    color: red;
}

.hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background:
        radial-gradient(circle at center, #350000 0%, #080000 35%, #050505 70%);
}

.hero h1 {
    font-size: 110px;
    color: #ff0000;
    text-shadow: 0 0 30px red;
    letter-spacing: 10px;
}

.hero p {
    font-size: 25px;
    color: #aaa;
    margin: 15px;
}

.button {
    display: inline-block;
    padding: 15px 35px;
    background: red;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    margin-top: 20px;
    transition: .2s;
}

.button:hover {
    background: #b00000;
    transform: scale(1.05);
}

section {
    padding: 100px 8%;
    text-align: center;
}

section h2 {
    font-size: 45px;
    color: red;
    margin-bottom: 45px;
}

.members {
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
}

.card {
    width: 280px;
    background: #101010;
    border: 1px solid #330000;
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 0 20px rgba(255,0,0,.08);
}

.card:hover {
    border-color: red;
}

.card h3 {
    font-size: 28px;
    margin-bottom: 10px;
}

.owner {
    color: red;
    font-weight: bold;
}

.member {
    color: #aaa;
}

form {
    max-width: 600px;
    margin: auto;
    background: #101010;
    padding: 35px;
    border-radius: 15px;
    border: 1px solid #330000;
}

input, textarea {
    width: 100%;
    margin: 10px 0;
    padding: 15px;
    background: #050505;
    color: white;
    border: 1px solid #333;
    border-radius: 7px;
    outline: none;
}

input:focus, textarea:focus {
    border-color: red;
}

textarea {
    height: 120px;
    resize: vertical;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    background: red;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #b00000;
}

.staff-box {
    max-width: 600px;
    margin: auto;
    background: #101010;
    padding: 30px;
    border-radius: 15px;
    border: 1px solid #330000;
}

.application {
    background: #080808;
    border: 1px solid #400000;
    padding: 20px;
    margin-top: 20px;
    border-radius: 10px;
    text-align: left;
}

.accept {
    background: #008f39;
}

.reject {
    background: #8f0000;
}

footer {
    padding: 30px;
    text-align: center;
    color: #555;
    border-top: 1px solid #222;
}

@media(max-width:700px) {
    .hero h1 {
        font-size: 65px;
    }

    nav a {
        margin: 0 7px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<nav>
    <a href="#home">HOME</a>
    <a href="#members">MEMBERS</a>
    <a href="#join">JOIN</a>
    <a href="#staff">STAFF</a>
</nav>

<section class="hero" id="home">
    <h1>RAVEN</h1>
    <p>CS2 CLAN</p>
    <a class="button" href="#join">JOIN RAVEN</a>
</section>

<section id="members">
    <h2>MEMBERS</h2>

    <div class="members">

        <div class="card">
            <h3>MONARCK</h3>
            <p class="owner">OWNER</p>
        </div>

        <div class="card">
            <h3>RENOX</h3>
            <p class="member">MEMBER</p>
        </div>

        <div class="card">
            <h3>KASPIKK</h3>
            <p class="member">MEMBER</p>
        </div>

    </div>
</section>

<section id="join">
    <h2>JOIN RAVEN</h2>

    <form id="joinForm">

        <input
            type="text"
            id="nick"
            placeholder="CS2 Nick"
            required
        >

        <input
            type="text"
            id="discord"
            placeholder="Discord"
            required
        >

        <input
            type="url"
            id="clip"
            placeholder="Clip URL"
        >

        <textarea
            id="about"
            placeholder="Tell us something about yourself..."
            required
        ></textarea>

        <button type="submit">
            SEND APPLICATION
        </button>

    </form>
</section>

<section id="staff">
    <h2>STAFF</h2>

    <div class="staff-box">

        <input
            type="password"
            id="password"
            placeholder="Staff password"
        >

        <button onclick="login()">
            STAFF LOGIN
        </button>

        <div id="applications"></div>

    </div>
</section>

<footer>
    RAVEN CS2 CLAN © 2026
</footer>

<script>

let applications =
    JSON.parse(localStorage.getItem("ravenApplications")) || [];

document.getElementById("joinForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const application = {
        nick: document.getElementById("nick").value,
        discord: document.getElementById("discord").value,
        clip: document.getElementById("clip").value,
        about: document.getElementById("about").value
    };

    applications.push(application);

    localStorage.setItem(
        "ravenApplications",
        JSON.stringify(applications)
    );

    alert("APPLICATION SENT!");

    this.reset();
});

function login() {

    const password =
        document.getElementById("password").value;

    if(password !== "raven123") {
        alert("WRONG PASSWORD!");
        return;
    }

    showApplications();
}

function showApplications() {

    const box =
        document.getElementById("applications");

    box.innerHTML = "";

    if(applications.length === 0) {
        box.innerHTML =
            "<p style='margin-top:20px;color:#777'>NO APPLICATIONS</p>";
        return;
    }

    applications.forEach((app, index) => {

        box.innerHTML += `
            <div class="application">

                <h3>${app.nick}</h3>

                <p>Discord: ${app.discord}</p>

                <p style="margin-top:10px">
                    ${app.about}
                </p>

                ${
                    app.clip
                    ? `<p style="margin-top:10px">
                        <a href="${app.clip}" target="_blank" style="color:red">
                        WATCH CLIP
                        </a>
                       </p>`
                    : ""
                }

                <button class="accept"
                    onclick="acceptApplication(${index})">
                    ACCEPT
                </button>

                <button class="reject"
                    onclick="rejectApplication(${index})">
                    REJECT
                </button>

            </div>
        `;
    });
}

function acceptApplication(index) {

    applications.splice(index, 1);

    localStorage.setItem(
        "ravenApplications",
        JSON.stringify(applications)
    );

    showApplications();

    alert("APPLICATION ACCEPTED!");
}

function rejectApplication(index) {

    applications.splice(index, 1);

    localStorage.setItem(
        "ravenApplications",
        JSON.stringify(applications)
    );

    showApplications();

    alert("APPLICATION REJECTED!");
}

</script>

</body>
</html>
