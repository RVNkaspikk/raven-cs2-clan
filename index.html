<script>

/* =========================================
   RAVEN APPLICATION SYSTEM
========================================= */

let applications =
    JSON.parse(
        localStorage.getItem("ravenApplications")
    ) || [];


/* =========================================
   RAVEN CLAN MEMBERS
========================================= */

let clanMembers =
    JSON.parse(
        localStorage.getItem("ravenClanMembers")
    ) || [

        {
            name: "MONARCH",
            role: "OWNER",
            protected: true
        },

        {
            name: "RENOX",
            role: "MEMBER",
            protected: false
        },

        {
            name: "KASPIKK",
            role: "MEMBER",
            protected: false
        }

    ];


/* =========================================
   INSTAGRAM
========================================= */

function openInstagram(url) {

    window.open(
        url,
        "_blank"
    );

}


/* =========================================
   SEND APPLICATION
========================================= */

function sendApplication(event) {

    event.preventDefault();

    const form = event.target;

    const inputs =
        form.querySelectorAll("input");

    const textarea =
        form.querySelector("textarea");


    const application = {

        nick: inputs[0].value,

        discord: inputs[1].value,

        clip: inputs[2].value,

        about: textarea.value,

        date: new Date().toLocaleString()

    };


    applications.push(application);


    localStorage.setItem(
        "ravenApplications",
        JSON.stringify(applications)
    );


    alert(
        "APPLICATION SENT!"
    );


    form.reset();

}


/* =========================================
   STAFF LOGIN
========================================= */

function staffLogin() {

    const password =
        document.getElementById(
            "staffPassword"
        ).value;


    const message =
        document.getElementById(
            "staffMessage"
        );


    if (password !== "raven123") {

        message.style.color =
            "#ff2222";

        message.innerHTML =
            "✕ WRONG PASSWORD";

        document.getElementById(
            "staffPanel"
        ).style.display = "none";

        return;

    }


    message.style.color =
        "#00ff66";

    message.innerHTML =
        "✓ STAFF ACCESS GRANTED";


    document.getElementById(
        "staffPanel"
    ).style.display =
        "block";


    showApplications();

    showClanMembers();

}


/* =========================================
   SHOW APPLICATIONS
========================================= */

function showApplications() {

    const box =
        document.getElementById(
            "applications"
        );


    if (!box) return;


    box.innerHTML = "";


    if (applications.length === 0) {

        box.innerHTML = `

            <div class="no-applications">

                NO APPLICATIONS

            </div>

        `;

        return;

    }


    applications.forEach(
        (app, index) => {

            box.innerHTML += `

                <div class="application">

                    <div class="application-header">

                        <h3>
                            ${escapeHTML(app.nick)}
                        </h3>

                        <span class="pending">
                            PENDING
                        </span>

                    </div>


                    <p>

                        <strong>
                            Discord:
                        </strong>

                        ${escapeHTML(app.discord)}

                    </p>


                    <p>

                        <strong>
                            About:
                        </strong>

                        <br>

                        ${escapeHTML(app.about)}

                    </p>


                    ${
                        app.clip
                        ?

                        `

                        <a
                            href="${escapeAttribute(app.clip)}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="clip-button"
                        >

                            🎬 WATCH CLIP

                        </a>

                        `

                        :

                        `

                        <div class="clip-button">

                            NO CLIP PROVIDED

                        </div>

                        `
                    }


                    <div class="application-buttons">


                        <button
                            class="accept"
                            onclick="acceptApplication(${index})"
                        >

                            ✓ ACCEPT

                        </button>


                        <button
                            class="reject"
                            onclick="rejectApplication(${index})"
                        >

                            ✕ REJECT

                        </button>


                    </div>


                    <div class="date">

                        ${escapeHTML(
                            app.date || ""
                        )}

                    </div>

                </div>

            `;

        }
    );

}


/* =========================================
   ACCEPT APPLICATION
========================================= */

function acceptApplication(index) {

    const app =
        applications[index];


    if (!app) return;


    const confirmed =
        confirm(
            "Accept " +
            app.nick +
            " into RAVEN?"
        );


    if (!confirmed) return;


    /*
       Add accepted player
       to clan members.
    */

    const alreadyMember =
        clanMembers.some(
            member =>
                member.name.toLowerCase()
                ===
                app.nick.toLowerCase()
        );


    if (!alreadyMember) {

        clanMembers.push({

            name: app.nick,

            role: "MEMBER",

            protected: false

        });

    }


    /*
       Remove application.
    */

    applications.splice(
        index,
        1
    );


    /*
       Save everything.
    */

    localStorage.setItem(
        "ravenApplications",
        JSON.stringify(applications)
    );


    localStorage.setItem(
        "ravenClanMembers",
        JSON.stringify(clanMembers)
    );


    alert(
        app.nick +
        " has been ACCEPTED into RAVEN!"
    );


    showApplications();

    showClanMembers();

}


/* =========================================
   REJECT APPLICATION
========================================= */

function rejectApplication(index) {

    const app =
        applications[index];


    if (!app) return;


    const confirmed =
        confirm(
            "Reject " +
            app.nick +
            "'s application?"
        );


    if (!confirmed) return;


    applications.splice(
        index,
        1
    );


    localStorage.setItem(
        "ravenApplications",
        JSON.stringify(applications)
    );


    alert(
        app.nick +
        " has been REJECTED!"
    );


    showApplications();

}


/* =========================================
   SHOW CLAN MEMBERS
========================================= */

function showClanMembers() {

    const box =
        document.getElementById(
            "clanMembers"
        );


    if (!box) return;


    box.innerHTML = "";


    if (clanMembers.length === 0) {

        box.innerHTML = `

            <div class="no-applications">

                NO CLAN MEMBERS

            </div>

        `;

        return;

    }


    clanMembers.forEach(
        (member, index) => {

            box.innerHTML += `

                <div style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    gap:15px;
                    padding:18px;
                    margin-bottom:10px;
                    background:#0d0d0d;
                    border:1px solid #252525;
                    border-radius:10px;
                ">


                    <div>

                        <strong style="
                            color:white;
                            font-size:18px;
                        ">

                            ${
                                member.protected
                                ? "👑 "
                                : ""
                            }

                            ${escapeHTML(
                                member.name
                            )}

                        </strong>


                        <div style="
                            color:#777;
                            font-size:11px;
                            margin-top:5px;
                            letter-spacing:2px;
                        ">

                            ${escapeHTML(
                                member.role
                            )}

                        </div>

                    </div>


                    ${
                        member.protected

                        ?

                        `

                        <span style="
                            color:#555;
                            font-size:10px;
                            letter-spacing:2px;
                            font-weight:bold;
                        ">

                            OWNER

                        </span>

                        `

                        :

                        `

                        <button
                            onclick="kickMember(${index})"
                            style="
                                padding:10px 18px;
                                border:0;
                                border-radius:7px;
                                background:#9b0000;
                                color:white;
                                font-weight:bold;
                                cursor:pointer;
                            "
                        >

                            KICK

                        </button>

                        `
                    }


                </div>

            `;

        }
    );

}


/* =========================================
   KICK MEMBER
========================================= */

function kickMember(index) {

    const member =
        clanMembers[index];


    if (!member) return;


    /*
       OWNER PROTECTION
    */

    if (member.protected) {

        alert(
            "👑 MONARCH IS THE OWNER AND CANNOT BE KICKED!"
        );

        return;

    }


    const confirmed =
        confirm(
            "KICK " +
            member.name +
            " FROM RAVEN?"
        );


    if (!confirmed) return;


    /*
       Remove member.
    */

    clanMembers.splice(
        index,
        1
    );


    /*
       Save updated clan.
    */

    localStorage.setItem(
        "ravenClanMembers",
        JSON.stringify(clanMembers)
    );


    alert(
        member.name +
        " HAS BEEN KICKED FROM RAVEN!"
    );


    /*
       Refresh member list.
    */

    showClanMembers();

}


/* =========================================
   SECURITY
========================================= */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(text) {

    return String(text)

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>
