<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAVEN — CS2 CLAN</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#050505;
    color:white;
    overflow-x:hidden;
}

/* BACKGROUND */
#particles{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:-2;
    background:
        radial-gradient(circle at 50% 20%,#220000 0%,#090000 30%,#050505 70%);
}

.dot{
    position:absolute;
    width:4px;
    height:4px;
    background:white;
    border-radius:50%;
    opacity:.7;
    animation:float 8s linear infinite;
}

@keyframes float{
    0%{
        transform:translateY(100vh);
        opacity:0;
    }
    15%{opacity:.8;}
    85%{opacity:.8;}
    100%{
        transform:translateY(-10vh);
        opacity:0;
    }
}

/* NAV */
nav{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    width:92%;
    max-width:1100px;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(20,20,20,.72);
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;
    backdrop-filter:blur(15px);
    z-index:1000;
    box-shadow:0 0 30px rgba(255,0,0,.12);
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:4px;
    color:#ff2020;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    font-size:14px;
    font-weight:bold;
    transition:.25s;
}

nav a:hover{
    color:#ff2020;
}

/* HERO */
.hero{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:120px 20px 60px;
}

.hero-content{
    max-width:900px;
}

.tag{
    color:#ff2929;
    font-weight:bold;
    letter-spacing:5px;
    margin-bottom:15px;
}

.hero h1{
    font-size:clamp(75px,17vw,190px);
    line-height:.8;
    letter-spacing:15px;
    font-weight:1000;
    text-shadow:
        0 0 15px rgba(255,0,0,.8),
        0 0 50px rgba(255,0,0,.35);
}

.hero p{
    margin:30px 0;
    color:#aaa;
    letter-spacing:3px;
}

.btn{
    display:inline-block;
    padding:15px 32px;
    background:#e50909;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:900;
    border:1px solid #ff3b3b;
    box-shadow:0 0 25px rgba(255,0,0,.35);
    transition:.25s;
    cursor:pointer;
}

.btn:hover{
    transform:translateY(-3px) scale(1.03);
    background:#ff2020;
    box-shadow:0 0 40px rgba(255,0,0,.6);
}

/* SECTIONS */
section{
    padding:100px 20px;
}

.container{
    max-width:1100px;
    margin:auto;
}

.section-title{
    text-align:center;
    font-size:45px;
    margin-bottom:55px;
    letter-spacing:4px;
}

.section-title span{
    color:#ff2020;
}

/* MEMBERS */
.members{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
}

.member{
    position:relative;
    padding:35px 20px;
    text-align:center;
    background:rgba(20,20,20,.72);
    border:1px solid rgba(255,255,255,.09);
    border-radius:20px;
    backdrop-filter:blur(12px);
    transition:.3s;
    cursor:pointer;
    overflow:hidden;
}

.member:hover{
    transform:translateY(-8px);
    border-color:#ff2020;
    box-shadow:0 15px 45px rgba(255,0,0,.18);
}

.member::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:2px;
    background:#ff2020;
    box-shadow:0 0 20px #ff2020;
}

.member-emoji{
    font-size:40px;
    margin-bottom:10px;
}

.member-name{
    font-size:25px;
    font-weight:900;
    letter-spacing:2px;
}

.member-role{
    margin-top:8px;
    color:#ff2929;
    font-size:12px;
    font-weight:bold;
    letter-spacing:3px;
}

/* JOIN */
.join-box{
    max-width:650px;
    margin:auto;
    padding:35px;
    background:rgba(15,15,15,.82);
    border:1px solid rgba(255,255,255,.1);
    border-radius:22px;
    backdrop-filter:blur(15px);
}

input,
textarea{
    width:100%;
    margin-bottom:15px;
    padding:15px;
    border-radius:10px;
    border:1px solid #292929;
    background:#090909;
    color:white;
    outline:none;
    font-size:15px;
}

input:focus,
textarea:focus{
    border-color:#ff2020;
    box-shadow:0 0 15px rgba(255,0,0,.15);
}

textarea{
    min-height:130px;
    resize:vertical;
}

/* STAFF */
.staff-login{
    max-width:450px;
    margin:auto;
    text-align:center;
}

.staff-panel{
    display:none;
    max-width:1000px;
    margin:30px auto 0;
}

.panel-box{
    background:rgba(15,15,15,.88);
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;
    padding:25px;
    margin-bottom:25px;
}

.application,
.staff-member{
    background:#0b0b0b;
    border:1px solid #222;
    border-radius:14px;
    padding:18px;
    margin-bottom:15px;
}

.application h3,
.staff-member h3{
    margin-bottom:8px;
}

.application p{
    color:#aaa;
    margin:5px 0;
    word-break:break-word;
}

.small-btn{
    border:0;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    color:white;
    font-weight:bold;
    margin:10px 8px 0 0;
}

.accept{
    background:#0b8f38;
}

.reject{
    background:#b00000;
}

.kick{
    background:#9b0000;
}

.small-btn:hover{
    filter:brightness(1.25);
}

/* FOOTER */
footer{
    padding:50px 20px;
    text-align:center;
    color:#777;
    border-top:1px solid #171717;
}

footer strong{
    color:#ff2020;
}

/* MOBILE */
@media(max-width:700px){
    nav{
        padding:12px 15px;
    }

    nav a{
        margin-left:9px;
        font-size:11px;
    }

    .logo{
        font-size:18px;
    }

    .hero h1{
        letter-spacing:7px;
    }

    .section-title{
        font-size:35px;
    }

    .join-box{
        padding:20px;
    }
}
</style>
</head>

<body>

<div id="particles"></div>

<nav>
    <div class="logo">RAVEN</div>

    <div>
        <a href="#home">HOME</a>
        <a href="#members">MEMBERS</a>
        <a href="#join">JOIN</a>
        <a href="#staff">STAFF</a>
    </div>
</nav>

<!-- HOME -->
<section class="hero" id="home">
    <div class="hero-content">
        <div class="tag">CS2 CLAN</div>

        <h1>RAVEN</h1>

        <p>PLAY HARD. AIM HARDER.</p>

        <a href="#join" class="btn">JOIN RAVEN</a>
    </div>
</section>

<!-- MEMBERS -->
<section id="members">
    <div class="container">

        <h2 class="section-title">
            RAVEN <span>MEMBERS</span>
        </h2>

        <div class="members" id="membersList"></div>

    </div>
</section>

<!-- JOIN -->
<section id="join">
    <div class="container">

        <h2 class="section-title">
            JOIN <span>RAVEN</span>
        </h2>

        <div class="join-box">

            <form id="joinForm">

                <input
                    id="nick"
                    type="text"
                    placeholder="CS2 Nickname"
                    required
                >

                <input
                    id="discord"
                    type="text"
                    placeholder="Discord"
                    required
                >

                <input
                    id="clip"
                    type="url"
                    placeholder="Clip URL"
                    required
                >

                <textarea
                    id="about"
                    placeholder="Tell us about yourself..."
                    required
                ></textarea>

                <button class="btn" type="submit">
                    SEND APPLICATION
                </button>

            </form>

        </div>
    </div>
</section>

<!-- STAFF -->
<section id="staff">
    <div class="container">

        <h2 class="section-title">
            RAVEN <span>STAFF</span>
        </h2>

        <div class="staff-login" id="staffLogin">

            <input
                id="staffPassword"
                type="password"
                placeholder="Staff Password"
            >

            <button class="btn" onclick="loginStaff()">
                LOGIN
            </button>

        </div>

        <div class="staff-panel" id="staffPanel">

            <div class="panel-box">
                <h2>APPLICATIONS</h2>
                <br>
                <div id="applicationsList"></div>
            </div>

            <div class="panel-box">
                <h2>CLAN MEMBERS</h2>
                <br>
                <div id="clanMembersList"></div>
            </div>

        </div>

    </div>
</section>

<footer>
    <strong>RAVEN ON TOP</strong><br><br>
    CS2 CLAN
</footer>


<script>

/* =========================
   BACKGROUND DOTS
========================= */

const particles = document.getElementById("particles");

for(let i = 0; i < 80; i++){

    const dot = document.createElement("div");

    dot.className = "dot";

    dot.style.left = Math.random() * 100 + "%";
    dot.style.animationDelay = Math.random() * 8 + "s";
    dot.style.animationDuration =
        (5 + Math.random() * 8) + "s";

    const size = 2 + Math.random() * 4;

    dot.style.width = size + "px";
    dot.style.height = size + "px";

    particles.appendChild(dot);
}


/* =========================
   DEFAULT MEMBERS
========================= */

const defaultMembers = [

    {
        id:1,
        name:"MONARCH",
        role:"OWNER",
        emoji:"👑",
        protected:true,
        instagram:"https://www.instagram.com/owner_monarch._fihh/"
    },

    {
        id:2,
        name:"RENOX",
        role:"MEMBER",
        emoji:"🗿",
        protected:false,
        instagram:"https://www.instagram.com/member_rvn_renox/"
    },

    {
        id:3,
        name:"KASPIKK",
        role:"MEMBER",
        emoji:"🗿",
        protected:false,
        instagram:"https://www.instagram.com/RVN_kaspikk/"
    }

];


/* =========================
   STORAGE
========================= */

function getMembers(){

    let data =
        localStorage.getItem("RAVEN_MEMBERS");

    if(!data){

        localStorage.setItem(
            "RAVEN_MEMBERS",
            JSON.stringify(defaultMembers)
        );

        return [...defaultMembers];
    }

    try{
        return JSON.parse(data);
    }catch{

        localStorage.setItem(
            "RAVEN_MEMBERS",
            JSON.stringify(defaultMembers)
        );

        return [...defaultMembers];
    }
}


function saveMembers(members){

    localStorage.setItem(
        "RAVEN_MEMBERS",
        JSON.stringify(members)
    );
}


function getApplications(){

    let data =
        localStorage.getItem("RAVEN_APPLICATIONS");

    if(!data){
        return [];
    }

    try{
        return JSON.parse(data);
    }catch{
        return [];
    }
}


function saveApplications(applications){

    localStorage.setItem(
        "RAVEN_APPLICATIONS",
        JSON.stringify(applications)
    );
}


/* =========================
   EMOJIS
========================= */

function getEmoji(member){

    const name =
        member.name.toUpperCase();

    if(name === "MONARCH"){
        return "👑";
    }

    if(name === "RENOX"){
        return "🗿";
    }

    if(name === "KASPIKK"){
        return "🗿";
    }

    return "💀";
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================
   SHOW MEMBERS
========================= */

function showMembers(){

    const list =
        document.getElementById("membersList");

    const members =
        getMembers();

    list.innerHTML = "";

    members.forEach(member => {

        const card =
            document.createElement("div");

        card.className = "member";

        const emoji =
            getEmoji(member);

        card.innerHTML = `

            <div class="member-emoji">
                ${emoji}
            </div>

            <div class="member-name">
                ${escapeHTML(member.name)}
            </div>

            <div class="member-role">
                ${escapeHTML(member.role)}
            </div>

        `;

        if(member.instagram){

            card.onclick = () => {

                window.open(
                    member.instagram,
                    "_blank"
                );

            };

        }

        list.appendChild(card);

    });
}


/* =========================
   JOIN APPLICATION
========================= */

document
.getElementById("joinForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    const nick =
        document.getElementById("nick").value.trim();

    const discord =
        document.getElementById("discord").value.trim();

    const clip =
        document.getElementById("clip").value.trim();

    const about =
        document.getElementById("about").value.trim();

    if(!nick || !discord || !clip || !about){

        alert("Vyplň všechna pole!");

        return;
    }

    const applications =
        getApplications();

    applications.push({

        id:Date.now(),

        nick:nick,

        discord:discord,

        clip:clip,

        about:about,

        date:new Date().toLocaleString("cs-CZ")

    });

    saveApplications(applications);

    alert(
        "APPLICATION SENT! 🔥"
    );

    document
        .getElementById("joinForm")
        .reset();

});


/* =========================
   STAFF LOGIN
========================= */

function loginStaff(){

    const password =
        document
        .getElementById("staffPassword")
        .value;

    if(password === "raven123"){

        document
            .getElementById("staffLogin")
            .style.display = "none";

        document
            .getElementById("staffPanel")
            .style.display = "block";

        showApplications();
        showClanMembers();

    }else{

        alert("ŠPATNÉ HESLO 💀");

    }
}


/* =========================
   SHOW APPLICATIONS
========================= */

function showApplications(){

    const box =
        document.getElementById(
            "applicationsList"
        );

    const applications =
        getApplications();

    box.innerHTML = "";

    if(applications.length === 0){

        box.innerHTML =
            "<p style='color:#777'>No applications.</p>";

        return;
    }

    applications.forEach(app => {

        const item =
            document.createElement("div");

        item.className = "application";

        item.innerHTML = `

            <h3>
                ${escapeHTML(app.nick)}
            </h3>

            <p>
                <b>Discord:</b>
                ${escapeHTML(app.discord)}
            </p>

            <p>
                <b>Clip:</b>
                <a
                    href="${escapeHTML(app.clip)}"
                    target="_blank"
                    style="color:#ff3030"
                >
                    OPEN CLIP
                </a>
            </p>

            <p>
                <b>About:</b>
                ${escapeHTML(app.about)}
            </p>

            <p style="font-size:12px;color:#555">
                ${escapeHTML(app.date)}
            </p>

            <button
                class="small-btn accept"
                onclick="acceptApplication(${app.id})"
            >
                ACCEPT
            </button>

            <button
                class="small-btn reject"
                onclick="rejectApplication(${app.id})"
            >
                REJECT
            </button>

        `;

        box.appendChild(item);

    });
}


/* =========================
   ACCEPT
========================= */

function acceptApplication(id){

    const applications =
        getApplications();

    const app =
        applications.find(
            x => x.id === id
        );

    if(!app) return;

    const confirmAccept =
        confirm(
            "Přijmout " +
            app.nick +
            " do RAVEN?"
        );

    if(!confirmAccept) return;

    const members =
        getMembers();

    const exists =
        members.some(
            m =>
            m.name.toLowerCase()
            === app.nick.toLowerCase()
        );

    if(!exists){

        members.push({

            id:Date.now(),

            name:app.nick,

            role:"MEMBER",

            emoji:"💀",

            protected:false,

            instagram:""

        });

        saveMembers(members);

    }

    const newApplications =
        applications.filter(
            x => x.id !== id
        );

    saveApplications(
        newApplications
    );

    showMembers();
    showApplications();
    showClanMembers();

    alert(
        app.nick +
        " je nyní člen RAVEN! 🔥"
    );
}


/* =========================
   REJECT
========================= */

function rejectApplication(id){

    const applications =
        getApplications();

    const app =
        applications.find(
            x => x.id === id
        );

    if(!app) return;

    if(!confirm(
        "Odmítnout " +
        app.nick +
        "?"
    )) return;

    const newApplications =
        applications.filter(
            x => x.id !== id
        );

    saveApplications(
        newApplications
    );

    showApplications();

}


/* =========================
   SHOW STAFF MEMBERS
========================= */

function showClanMembers(){

    const box =
        document.getElementById(
            "clanMembersList"
        );

    const members =
        getMembers();

    box.innerHTML = "";

    members.forEach(member => {

        const item =
            document.createElement("div");

        item.className =
            "staff-member";

        const emoji =
            getEmoji(member);

        item.innerHTML = `

            <h3>
                ${emoji}
                ${escapeHTML(member.name)}
            </h3>

            <p style="color:#ff3030">
                ${escapeHTML(member.role)}
            </p>

            ${
                member.protected
                ?
                `
                <p style="color:#777">
                    OWNER — PROTECTED
                </p>
                `
                :
                `
                <button
                    class="small-btn kick"
                    onclick="kickMember(${member.id})"
                >
                    KICK
                </button>
                `
            }

        `;

        box.appendChild(item);

    });
}


/* =========================
   KICK MEMBER
========================= */

function kickMember(id){

    const members =
        getMembers();

    const member =
        members.find(
            x => x.id === id
        );

    if(!member) return;

    if(member.protected){

        alert(
            "MONARCH NELZE VYHODIT 👑"
        );

        return;
    }

    if(!confirm(
        "Vyhodit " +
        member.name +
        " z RAVEN?"
    )) return;

    const newMembers =
        members.filter(
            x => x.id !== id
        );

    saveMembers(newMembers);

    showMembers();
    showClanMembers();

    alert(
        member.name +
        " byl vyhozen z RAVEN."
    );
}


/* =========================
   START
========================= */

showMembers();

</script>

</body>
</html>
